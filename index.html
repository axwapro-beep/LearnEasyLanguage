<style>
:root{
  --bg:#FFFFFF; --group:#F2F2F7; --fill:#EFEFF4; --ink:#111114; --muted:#6C6C72; --faint:#A1A1A8; --line:#E3E3E8;
  --accent:#0A66E0; --accent-press:#0752B8; --accent-soft:#E8F0FD;
  --ok:#1E8E4E; --ok-soft:#E7F5EC; --warn:#9A6400; --warn-soft:#FFF5DE; --bad:#D93025; --bad-soft:#FDECEA;
  --r:14px; --r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;font-variant-numeric:normal}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{display:flex;flex-direction:column;height:100dvh;max-width:680px;margin:0 auto;background:var(--bg)}

/* Kopfzeile */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 10px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:36px;height:36px;flex:none;display:block}
h1{font-family:var(--font-d);font-weight:700;font-size:17px;margin:0;line-height:1.15;letter-spacing:-.01em}
#subtitle{margin:1px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{background:var(--group);color:var(--ink);font-weight:600;border-radius:999px;padding:5px 12px;font-size:14px;flex:none}
.notice{background:var(--warn-soft);color:#5C3D00;font-size:14px;padding:10px 14px;margin:0 16px 8px;border-radius:var(--r-sm)}

main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%;overflow-y:auto;padding:8px 18px 32px}
.view.active{display:block}
#view-chat.active{display:flex;flex-direction:column;padding:0}

/* Typografie */
h2{font-family:var(--font-d);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:8px 0 6px}
h3{font-family:var(--font-d);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0;line-height:1.25}
h4{font-weight:600}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.empty{color:var(--muted);font-size:15px;margin:6px 0 0}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.link{border:0;background:none;color:var(--accent);font-weight:500;padding:4px 0;font-size:15px}

/* Knöpfe */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:16px;background:var(--accent);color:#fff}
.btn:active{background:var(--accent-press)}
.btn.ghost{background:var(--group);color:var(--accent)}
.btn.ghost:active{background:var(--fill)}
.btn.warn{background:var(--bad);color:#fff}
.btn.small{padding:8px 13px;font-size:14.5px;border-radius:10px}
.btn.go{padding:12px 22px}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.mini{border:0;background:none;font-size:17px;padding:2px 4px}

/* Gruppen / Karten */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.lvlhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.lvlhead small{color:var(--muted);font-size:13px}
.bar,.rbar{height:4px;border-radius:4px;background:var(--fill);overflow:hidden;margin:8px 0 10px}
.bar i,.rbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"›";display:inline-block;margin-left:6px;color:var(--faint);transform:rotate(90deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-90deg)}
.card details{margin-top:0}
.card details summary{font-size:15.5px;color:var(--ink)}
.card details[open] summary{margin-bottom:8px}
.okpill{color:var(--ok);font-weight:600;font-size:14px;flex:none;background:none;padding:0}
.okpill.sm{font-size:12.5px}
.vhead2{margin:0}
.vhead2 h2{margin:8px 0 6px}

/* Segmentierte Auswahl (iOS) */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:14px;font-weight:500;color:var(--ink)}
.seg button.active{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* Start */
.hello{margin:4px 0 16px}
.hello h2{font-size:32px;margin:6px 0 4px}
.hello p{margin:0;color:var(--muted);font-size:15px}
.hero2{border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px}
.hero-k{display:block;color:var(--muted);font-size:13.5px;font-weight:500;margin-bottom:6px}
.hero2 h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.hero2 p{margin:0 0 18px;color:var(--muted);font-size:15px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.qbtn{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.qbtn b{font-family:var(--font-d);font-size:28px;line-height:1.1;font-weight:700;color:var(--ink)}
.qbtn span{color:var(--muted);font-size:13.5px}
.qbtn:active{background:var(--group)}
.wotd{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.wotd-k{color:var(--muted);font-size:13.5px;margin:0}
.wpt{font-family:var(--font-d);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:4px 0 0;display:flex;align-items:center;gap:8px}
.wde{margin:2px 0 14px;color:var(--muted);font-size:15.5px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px}
.scroller{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.scroller::-webkit-scrollbar{display:none}
.scen-mini{flex:none;width:148px;scroll-snap-align:start;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px;text-align:left}
.scen-mini .e{font-size:24px;display:block}
.scen-mini b{display:block;margin-top:6px;font-size:15px;font-weight:600}
.scen-mini small{display:block;color:var(--muted);font-size:13px;line-height:1.3;margin-top:2px}
.how{margin-top:26px}
.how ol{list-style:none;counter-reset:s;margin:10px 0 0;padding:0}
.how li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.how li:first-child{border-top:0}
.how li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--group);color:var(--ink);font-weight:600;display:grid;place-items:center;font-size:13.5px}
.how li b{font-weight:600}
.how li span{color:var(--muted);display:block;font-size:14px}

/* Chat */
#chatlog{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;line-height:1.45;font-size:16px;word-wrap:break-word}
.msg p{margin:0 0 7px}.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:4px 0 7px;padding-left:20px}.msg li{margin:3px 0}
.msg h4{margin:4px 0 6px;font-size:16px}
.msg hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.msg code{background:rgba(0,0,0,.06);padding:0 4px;border-radius:4px}
.msg.assistant{background:var(--group);align-self:flex-start;border-bottom-left-radius:6px}
.msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg b.pt{color:var(--accent);font-weight:600}
.msg.user b.pt{color:#fff}
.speak{margin-top:9px;border:0;background:#fff;color:var(--accent);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.typing::after{content:"";display:inline-block;width:30px;height:10px;background:radial-gradient(circle,var(--faint) 2.5px,transparent 3px) 0 50%/10px 10px repeat-x;animation:dots 1s infinite linear;vertical-align:middle}
@keyframes dots{to{background-position:10px 50%}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip:active{background:var(--group)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#composer{display:flex;align-items:flex-end;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--bg)}
#input{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:9px 14px;font:inherit;font-size:16px;background:var(--bg);max-height:130px;outline:none}
#input:focus{border-color:var(--accent)}
.icon,.send{width:38px;height:38px;border-radius:50%;border:0;flex:none;display:grid;place-items:center;font-size:17px}
.icon{background:var(--group)}
.icon.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.send{background:var(--accent);color:#fff}
.send svg{width:18px;height:18px}
.send:disabled{opacity:.35}

/* Tab-Leiste (iOS) */
nav#tabs{display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.96);padding:5px 4px 7px}
nav#tabs button{position:relative;flex:1;border:0;background:none;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--faint)}
nav#tabs button i{display:grid;place-items:center;width:30px;height:28px}
nav#tabs svg{width:25px;height:25px}
nav#tabs button.active{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:#FF3B30;color:#fff;font-style:normal;font-size:11px;font-weight:600;border-radius:999px;padding:1px 6px;line-height:1.35}

/* Lektionen */
.lesson{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:11px 0;border-top:1px solid var(--line)}
.lesson:first-of-type{border-top:0}
.lesson .st{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--group);color:var(--faint)}
.lesson.done .st{background:var(--ok);color:#fff}
.lesson.open .st{background:var(--accent);color:#fff}
.lesson.locked{opacity:.45}
.lesson b{display:block;font-size:15.5px;font-weight:600}
.lesson small{display:block;color:var(--muted);font-size:13px;line-height:1.3}

/* Gespräch */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scen{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px;text-align:left}
.scen .e{font-size:24px}
.scen b{display:block;margin-top:6px;font-weight:600}
.scen small{color:var(--muted);font-size:13px;line-height:1.3;display:block}

/* Trainer */
.statline{display:flex;justify-content:space-between;gap:6px;margin:0 2px 12px;font-size:14px;color:var(--muted)}
.statline b{color:var(--ink);font-weight:600}
.flash{text-align:center;padding:26px 18px 22px;border-radius:18px}
.flash .dirlbl{font-size:14px;color:var(--muted)}
.flash .word{font-family:var(--font-d);font-weight:700;font-size:32px;letter-spacing:-.02em;margin:14px 0 6px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.sub{font-size:17px;color:var(--muted);margin:0 0 16px}
.reps{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px auto 0;max-width:220px;font-size:12.5px;color:var(--muted)}
.rbar{flex:1;margin:0}
.flash input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:18px;text-align:center;background:var(--bg);outline:none;margin-top:10px}
.flash input:focus{border-color:var(--accent)}
.acc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.acc button{border:0;background:var(--group);border-radius:8px;width:34px;height:34px;font-size:16px}
.acc button:active{background:var(--fill)}
.fb{margin-top:14px;border-radius:12px;padding:11px 13px;font-size:15.5px;text-align:left}
.fb.ok{background:var(--ok-soft);color:#155C34}
.fb.mid{background:var(--warn-soft);color:#5C3D00}
.fb.bad{background:var(--bad-soft);color:#8A1F17}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15.5px}
.vlist li:first-child{border-top:0}
.vlist .pt{font-weight:600}
.vlist .de{color:var(--muted);flex:1}
.dots{color:var(--faint);font-size:12px;flex:none}
.addrow{display:flex;gap:6px;margin-top:12px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px;background:var(--bg)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#vHelp summary,#myList summary{color:var(--ink)!important}

/* Lautsprecher */
.spk{border:0;background:var(--group);color:var(--accent);width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;vertical-align:middle;flex:none;padding:0}
.word .spk,.ehead .spk,.wpt .spk{width:38px;height:38px}
.spk:active{background:var(--fill)}
.spk svg{width:19px;height:19px}
.saypop{position:fixed;z-index:40;background:#fff;border-radius:16px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06);width:224px}
.sp-q{margin:0 0 10px;font-weight:600;font-size:14px;text-align:center;color:var(--muted)}
.sp-row{display:flex;gap:8px}
.sp-row button{flex:1;border:0;border-radius:12px;padding:12px 6px;font-size:16px;font-weight:600;background:var(--group);color:var(--ink)}
.sp-row button:active{background:var(--accent);color:#fff}
.sp-note{margin:10px 0 0;font-size:12.5px;color:var(--muted);text-align:center}

/* Themen */
.trow{display:flex;align-items:center;gap:12px}
.te{font-size:26px;flex:none}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:16px;font-weight:600}
.tt small{color:var(--muted);font-size:13px}
.tt .bar{margin:6px 0 2px}
.lvl-title{margin:24px 0 10px}
.lvlrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.switch{width:51px;height:31px;border-radius:999px;border:0;background:#E5E5EA;position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:#34C759}
.switch.on i{left:22px}

/* Wörterbuch */
input.search{width:100%;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:16px;background:var(--fill);outline:none;margin-bottom:14px}
input.search:focus{box-shadow:0 0 0 2px var(--accent)}
.hit{cursor:pointer}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.entry h4{margin:18px 0 6px;font-size:15px}
.ehead{font-size:28px;font-weight:700;display:flex;align-items:center;gap:10px}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.ede{font-size:18px;margin:8px 0}
.entry p{margin:7px 0;line-height:1.45}
.ex b.ptc{color:var(--accent)}
.ex span{color:var(--muted)}
.conj{border-collapse:collapse;width:100%;font-size:15.5px}
.conj td{padding:7px 4px;border-top:1px solid var(--line)}
.conj tr:first-child td{border-top:0}
.conj td:first-child{color:var(--muted);width:42%}

/* Üben & Grammatik */
.exopt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:16px;margin-bottom:10px}
.exopt .e{font-size:26px;flex:none}
.exopt b{display:block;font-size:16.5px;font-weight:600}
.exopt small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.exde{font-size:18px;margin:12px 0 16px;font-weight:600}
.answer{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.answer.ok{border:1.5px solid var(--ok);background:var(--ok-soft)}
.answer.bad{border:1.5px solid var(--bad);background:var(--bad-soft)}
.answer .ph{color:var(--faint);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px;min-height:20px}
.tok{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:16.5px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tok:active{background:var(--group)}
.answer .tok{color:var(--accent);font-weight:600}
.exans{width:100%;margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;background:var(--bg);outline:none;resize:none}
.exans:focus{border-color:var(--accent)}
.marked{margin:8px 0;font-size:17px;line-height:1.6}
.wok{color:var(--ok);font-weight:600}
.wbad{color:var(--bad);font-weight:600;text-decoration:underline wavy}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vchips .chip{padding:6px 12px}
.vhead{margin:4px 0 8px;font-size:16px}
.vinf{font-family:var(--font-d);font-size:24px;font-weight:700}
.note{background:var(--group);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:15px}
.note p{margin:0 0 4px}.note p:last-child{margin:0}
.note b.pt,.cbody b.pt{color:var(--accent);font-weight:600}
.cheat summary{font-size:16px!important}
.cbody{margin-top:4px;font-size:15.5px}
.cbody p{margin:0 0 8px}.cbody ul{margin:0 0 8px;padding-left:20px}.cbody li{margin:5px 0}

/* Fortschritt */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{font-family:var(--font-d);font-size:28px;font-weight:700;display:block;line-height:1.1}
.stat small{color:var(--muted);font-size:13.5px}
.taglist{margin:8px 0 0;padding-left:18px}
.taglist li{margin:4px 0;font-size:15.5px}
.path{display:flex;gap:6px;margin:10px 0 2px}
.path span{flex:1;text-align:center;font-weight:600;font-size:13.5px;padding:7px 0;border-radius:8px;background:var(--group);color:var(--faint)}
.path span.past{background:var(--ok-soft);color:var(--ok)}
.path span.now{background:var(--accent);color:#fff}
.diag{background:var(--group);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14.5px}
.diag ul{margin:6px 0 0;padding-left:18px}
.diag li{margin:3px 0}
.vrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.vrow b{width:44px;flex:none;font-weight:600}
.vrow select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:15px;background:#fff}

/* Overlays */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:360px;width:100%}
.modal p{margin:8px 0 16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(16px);background:rgba(28,28,30,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:30;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===================== DESIGNSYSTEM „Português“ ===================== */
:root{
  --bg:#FFFFFF; --group:#F3F5F9; --fill:#ECEFF5; --ink:#1E2633; --muted:#6B7584; --faint:#A3ABB8; --line:#E5E9F0;
  --accent:#2F6BFF; --accent-press:#1F4FD1; --accent-soft:#E9F0FF;
  --green:#16A974; --green-d:#0E8A5D; --coral:#FF6B4A; --purple:#8B5CF6; --gold:#FFB800; --gold-d:#D99A00; --red:#FF4B55; --red-d:#D9303A; --teal:#0EA5A4;
  --ok:#16A974; --ok-soft:#E3F7EE; --bad:#FF4B55; --bad-soft:#FFECEE; --warn:#B07A00; --warn-soft:#FFF4D6;
  --font:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --font-d:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-sm:12px;
}
html,body{font-weight:600}
b,strong{font-weight:800}
h1,h2,h3{font-weight:900}
.btn,.btn3d{font-weight:800}

/* Kopfzeile */
header{padding:8px 12px 6px;border-bottom:2px solid var(--line)}
.topstats{display:flex;justify-content:space-between;align-items:center;width:100%;gap:6px}
.ts{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 8px;border-radius:12px;font-size:17px;font-weight:900;color:var(--ink)}
.ts:active{background:var(--group)}
.ts svg{width:24px;height:24px}
.ts-lvl{font-size:16px}
.ts-fire{color:#FF8A00}.ts-fire.dim{color:#C8CDD6}
.ts-xp{color:var(--gold)}
.ts-heart{color:var(--red)}
.ts b{color:inherit}
.ts-lvl b{color:var(--ink)}

/* 3D-Knöpfe */
.btn3d{--b:var(--accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:14px 18px;font-size:17px;color:#fff;background:var(--b);box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .06s,box-shadow .06s;letter-spacing:.01em}
.btn3d:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn3d:disabled{background:#E3E7EE;color:#9AA3AF;box-shadow:0 4px 0 #CDD3DD}
.btn3d svg{width:20px;height:20px}
.btn3d.ghost{background:#fff;color:var(--accent);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line)}
.btn3d.small{width:auto;padding:10px 14px;font-size:15px}
.btn3d.red{--b:var(--red)}
.btn3d.gold{--b:var(--gold)}
.btn3d.gray{--b:#C3C9D3}

/* Tab-Leiste */
nav#tabs{border-top:2px solid var(--line);background:#fff;padding:6px 4px 8px}
nav#tabs button{font-size:11px;font-weight:800;color:var(--faint)}
nav#tabs button i{width:46px;height:32px;border-radius:12px}
nav#tabs svg{width:26px;height:26px}
nav#tabs button.active{color:var(--accent)}
nav#tabs button.active i{background:var(--accent-soft);box-shadow:0 0 0 2px #CFDDFF inset}
body.playing nav#tabs,body.playing header{visibility:hidden}

/* Seiten */
.pg-title{font-size:28px;margin:10px 0 14px}
.sub-title{font-size:18px;margin:22px 2px 10px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.center{text-align:center}
.backbar{position:sticky;top:-8px;z-index:3;display:flex;align-items:center;gap:8px;background:#fff;margin:-8px -18px 8px;padding:8px 12px;border-bottom:2px solid var(--line)}
.backbar b{font-size:17px}
.back{border:0;background:var(--group);width:36px;height:36px;border-radius:12px;font-size:22px;font-weight:900;color:var(--ink);line-height:1}
#view-chat .backbar{position:static;margin:0;flex:none}

/* Lernpfad */
#view-learn{padding:8px 16px 40px;background:#fff}
.goal-strip{display:flex;align-items:center;gap:12px;background:var(--group);border-radius:16px;padding:10px 14px;margin:6px 0 16px}
.gs-txt{display:flex;flex-direction:column;flex:none}
.gs-txt b{font-size:14px}.gs-txt span{font-size:13px;color:var(--muted)}
.gs-bar{flex:1;height:12px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.gs-bar i{display:block;height:100%;background:linear-gradient(90deg,#FFC93C,var(--gold));border-radius:99px;transition:width .6s}
.warn-banner,.heart-banner{display:flex;gap:12px;align-items:center;background:#FFF2E2;border-radius:16px;padding:12px 14px;margin:6px 0 10px;color:#7A3E00}
.warn-banner svg,.heart-banner svg{width:34px;height:34px;flex:none;color:#FF8A00}
.heart-banner{background:var(--bad-soft);color:#8A1F26}.heart-banner svg{color:var(--red)}
.warn-banner span,.heart-banner span{display:block;font-size:13.5px}
.sec{margin-bottom:28px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--c);color:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 5px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.sec-head::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.sec-head small{font-size:12.5px;font-weight:800;opacity:.9}
.sec-head h2{color:#fff;font-size:22px;margin:2px 0 0}
.sec-head p{margin:0;opacity:.9;font-weight:700;font-style:italic}
.sec-prog{background:rgba(255,255,255,.22);border-radius:12px;padding:6px 10px;font-weight:900;flex:none;position:relative;z-index:1}
.sec.locked .sec-head{filter:grayscale(.85);opacity:.6}
.unit{margin:22px 0 6px}
.unit-head{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.unit-e{width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,#fff);display:grid;place-items:center;font-size:24px;flex:none}
.unit-t{flex:1;min-width:0}
.unit-t small{color:var(--c);font-weight:900;font-size:12px}
.unit-t b{display:block;font-size:17px;line-height:1.2}
.unit-t span{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.unit-ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--fill) 0);display:grid;place-items:center;flex:none}
.unit-ring span{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:900}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 8px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{position:relative;width:72px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 70%,#000);transition:transform .08s,box-shadow .08s}
.node svg{width:32px;height:32px}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 70%,#000)}
.node.lock{background:#E3E7EE;color:#AEB5C1;box-shadow:0 7px 0 #C9CFD9}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.done.n-chest{background:#E3E7EE;color:#AEB5C1;box-shadow:0 7px 0 #C9CFD9}
.node.n-chest:not(.done):not(.lock){background:#C7782E;box-shadow:0 7px 0 #8E4F17}
.node.cur{animation:bob 1.6s ease-in-out infinite}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid color-mix(in srgb,var(--c) 35%,transparent)}
.node-check{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--gold-d);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.node-check svg{width:16px;height:16px}
.node-bubble{position:absolute;top:-40px;background:#fff;color:var(--c);border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-weight:900;font-size:14px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:1}
.node-bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.node-wrap:has(.node-bubble){margin-top:30px}
@keyframes bob{50%{transform:translateY(-5px)}}
.path-end{text-align:center;color:var(--muted);padding:10px 20px 30px}

/* Bottom-Sheet */
.sheet{position:fixed;inset:0;z-index:25}
.sh-bg{position:absolute;inset:0;background:rgba(15,20,30,.35);animation:fade .2s}
.sh-in{--c:var(--accent);position:absolute;left:0;right:0;bottom:0;max-width:680px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.9,.3,1.2)}
.sh-grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;gap:12px;align-items:center}
.sh-ic{width:54px;height:54px;border-radius:16px;background:color-mix(in srgb,var(--c) 15%,#fff);display:grid;place-items:center;font-size:28px;flex:none}
.sh-top small{color:var(--c);font-weight:900}
.sh-top h3{font-size:22px}
.sh-desc{color:var(--muted);margin:12px 0}
.sh-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-weight:800;font-size:14px}
.sh-meta span{display:flex;align-items:center;gap:4px}
.sh-meta svg{width:18px;height:18px;color:var(--gold)}
.sh-meta .ok{color:var(--green)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

/* Spieler */
.player{position:fixed;inset:0;z-index:30;background:#fff;display:flex;flex-direction:column;max-width:680px;margin:0 auto}
.pl-top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.pl-x{border:0;background:none;font-size:22px;color:var(--faint);width:36px;height:36px}
.pl-bar{flex:1;height:16px;background:var(--fill);border-radius:99px;overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s cubic-bezier(.3,.9,.4,1.1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.25)}
.pl-hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:900;font-size:17px;min-width:44px;justify-content:flex-end}
.pl-hearts svg{width:24px;height:24px}
.pl-free{font-size:13px;color:var(--muted);background:var(--group);border-radius:99px;padding:3px 9px}
.pl-body{flex:1;overflow-y:auto;padding:12px 18px 18px}
.pl-body.pop{animation:popin .28s ease-out}
.pl-body.good .opt.sel,.pl-body.good .answer-line{animation:joy .5s}
@keyframes popin{from{opacity:0;transform:translateX(18px)}}
@keyframes joy{40%{transform:scale(1.05)}}
.pl-q{font-size:22px;font-weight:900;margin:6px 0 18px}
.q-word{font-size:30px;font-weight:900;margin:4px 0 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q-sent{font-size:20px;font-weight:800;line-height:1.4;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-sent.cloze{display:block}
.q-hint{color:var(--muted);margin:2px 0 18px;font-size:15px}
.gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center;padding:0 4px}
.opts{display:grid;gap:10px}
.opts.row2{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;font-size:17px;font-weight:800;text-align:left;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.opt.sel{border-color:#9CB9FF;background:var(--accent-soft);color:var(--accent-press);box-shadow:0 4px 0 #9CB9FF}
.answer-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0 12px;margin:12px 0 18px;background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 13px;font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.tok.used{background:var(--fill);color:transparent;box-shadow:none;border-color:var(--fill)}
.tok.in{animation:popin .2s}
.ans-in{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px;font:inherit;font-size:18px;font-weight:700;background:var(--group);outline:none;resize:none}
.ans-in:focus{border-color:var(--accent);background:#fff}
.player .acc{margin-top:10px}
.player .acc button{background:#fff;border:2px solid var(--line);border-radius:10px;font-weight:800}
.listen-big{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin:6px 0 22px}
.play-big{width:96px;height:96px;border-radius:26px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 var(--accent-press)}
.play-big svg{width:46px;height:46px}
.play-slow{width:60px;height:60px;border-radius:18px;border:0;background:var(--accent-soft);font-size:26px;box-shadow:0 4px 0 #C6D6FF}
.play-big:active,.play-slow:active{transform:translateY(3px);box-shadow:none}
.intro-card{border:2px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center;position:relative;box-shadow:0 5px 0 var(--line)}
.ic-new{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--purple);color:#fff;font-weight:900;font-size:13px;padding:3px 12px;border-radius:99px}
.big-pt{font-size:32px;font-weight:900;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.big-de{font-size:19px;color:var(--muted);margin:4px 0 6px}
.intro-x{text-align:left;font-size:15px}
.ix-say,.ix-tip,.ix-ex{background:var(--group);border-radius:14px;padding:10px 12px;margin-top:10px}
.ix-ex span{color:var(--muted)}
.speak-area{text-align:center;margin-top:14px}
.mic-big{width:96px;height:96px;border-radius:50%;border:0;background:var(--purple);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 0 #6D3FE0}
.mic-big svg{width:44px;height:44px}
.mic-big.on{background:var(--red);box-shadow:0 6px 0 var(--red-d);animation:pulse 1.2s infinite}
.chat-dlg{margin:4px 0 20px}
.dlg-a{display:flex;gap:10px;align-items:flex-end}
.dlg-av{width:44px;height:44px;border-radius:50%;background:var(--group);display:grid;place-items:center;font-size:24px;flex:none}
.dlg-b{background:var(--group);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:18px;font-weight:800}
.dlg-b small{display:block;color:var(--muted);font-size:13.5px;font-weight:700}
.story{display:flex;flex-direction:column;gap:12px}
.st-line{display:flex;gap:8px;align-items:flex-start;animation:popin .3s}
.st-line.me{flex-direction:row-reverse}
.st-who{font-size:12px;font-weight:900;color:var(--muted);width:54px;flex:none;padding-top:10px;text-align:center}
.st-b{background:var(--group);border-radius:18px;padding:10px 12px;font-size:17px;font-weight:800;max-width:78%}
.st-line.me .st-b{background:var(--accent-soft)}
.st-b small{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-top:2px}
.pl-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--line)}
.pl-foot.fb-ok{background:var(--ok-soft);border-top-color:transparent;animation:up .22s ease-out}
.pl-foot.fb-bad{background:var(--bad-soft);border-top-color:transparent;animation:up .22s ease-out}
.fb-head{display:flex;align-items:center;gap:10px;font-size:21px;margin-bottom:6px}
.fb-head svg{width:30px;height:30px;flex:none}
.fb-ok .fb-head{color:var(--green-d)}.fb-bad .fb-head{color:var(--red-d)}
.fb-sol{font-size:16px;margin:4px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb-ok .fb-sol{color:#0B5E3F}.fb-bad .fb-sol{color:#8A1F26}
.fb-exp{font-size:14.5px;color:var(--ink);margin:6px 0;font-weight:600}
.fb-exp:empty{display:none}
.fb-exp p{margin:0 0 4px}
.fb-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fb-btns .btn3d:last-child{flex:1;min-width:120px}
.fb-ok .btn3d:not(.ghost){--b:var(--green)}
.done-screen{text-align:center;padding:20px 4px}
.done-badge{width:120px;height:120px;border-radius:50%;margin:10px auto 14px;background:radial-gradient(circle at 35% 30%,#FFE69A,var(--gold));display:grid;place-items:center;font-size:58px;box-shadow:0 8px 0 var(--gold-d);animation:pop 0.6s cubic-bezier(.2,1.6,.4,1)}
.done-badge.fail{background:radial-gradient(circle at 35% 30%,#D8E4FF,#9CB9FF);box-shadow:0 8px 0 #7A9CEB}
@keyframes pop{from{transform:scale(.3)}}
.done-screen h2{font-size:30px;margin:6px 0}
.done-sub{color:var(--muted);margin:0 0 18px}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.ds{border-radius:16px;padding:4px;border:2px solid}
.ds small{display:block;font-size:12px;font-weight:900;color:#fff;padding:3px;border-radius:10px 10px 0 0;margin:-4px -4px 6px}
.ds b{font-size:20px;display:block;padding-bottom:6px}
.ds-xp{border-color:var(--gold)}.ds-xp small{background:var(--gold)}.ds-xp b{color:var(--gold-d)}
.ds-acc{border-color:var(--green)}.ds-acc small{background:var(--green)}.ds-acc b{color:var(--green-d)}
.ds-time{border-color:var(--accent)}.ds-time small{background:var(--accent)}.ds-time b{color:var(--accent)}
.done-heart{color:var(--red-d);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.done-heart svg{width:22px;height:22px}
.reward-row{display:flex;gap:12px;align-items:center;text-align:left;background:var(--group);border-radius:16px;padding:12px;margin-top:10px;animation:popin .4s}
.reward-row>span{font-size:30px}
.reward-row small{display:block;color:var(--muted)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* Kacheln & Zeilen */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{--c:var(--accent);border:2px solid var(--line);background:#fff;border-radius:20px;padding:14px;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:2px;transition:transform .06s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tl-e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 15%,#fff);margin-bottom:6px}
.tile b{font-size:16px}
.tile small{color:var(--muted);font-size:13px;line-height:1.3}
.card2{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card2 h3{font-size:18px;margin:0 0 10px}
.card2 h4{font-size:14.5px;margin:14px 0 6px;color:var(--muted)}
.weak-row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:10px;align-items:center;padding:6px 0}
.weak-row span{font-weight:800}
.wbar{height:10px;background:var(--fill);border-radius:99px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--coral);border-radius:99px}
.weak-row small{color:var(--muted);font-size:12.5px}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;background:var(--group);border-radius:99px;padding:4px 6px 4px 12px;font-size:14px}
.wchip .spk{width:28px;height:28px}
.rows{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.rowbtn{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;text-align:left;box-shadow:0 3px 0 var(--line)}
.rowbtn:active{transform:translateY(2px);box-shadow:none}
.rb-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;flex:none}
.rowbtn span:nth-child(2){flex:1}
.rowbtn b{display:block;font-size:16px}
.rowbtn small{color:var(--muted);font-size:13px}
.rowbtn i{font-style:normal;font-size:24px;color:var(--faint)}
.teacher-card{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:22px;padding:16px;margin-bottom:14px;text-align:left;color:#fff;background:linear-gradient(135deg,#2F6BFF,#8B5CF6);box-shadow:0 5px 0 #5A3FD0}
.teacher-card:active{transform:translateY(3px);box-shadow:0 2px 0 #5A3FD0}
.tc-av{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.tc-av svg{width:46px;height:46px}
.tc-t{flex:1}
.tc-t b{display:block;font-size:19px}
.tc-t small{display:block;font-size:13.5px;opacity:.92;line-height:1.35}
.tc-go{background:rgba(255,255,255,.22);border-radius:12px;padding:6px 10px;font-weight:900;flex:none}
.scen-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.scen2{border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;text-align:left;box-shadow:0 3px 0 var(--line)}
.scen2 span{font-size:26px}
.scen2 b{display:block;font-size:15px;margin-top:4px}
.scen2 small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}

/* Erfolge */
.hero-stats{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--fill) 0);display:grid;place-items:center;flex:none}
.ring>div{width:94px;height:94px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:28px;line-height:1}.ring small{color:var(--muted);font-size:12.5px}
.hs-r{flex:1;display:grid;gap:10px}
.hs-i{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:8px 12px}
.hs-i svg{width:30px;height:30px;grid-row:span 2}
.hs-i b{font-size:22px;line-height:1.1}.hs-i small{color:var(--muted);font-size:12.5px}
.hs-i.fire svg{color:#FF8A00}.hs-i.xp svg{color:var(--gold)}
.chart{display:flex;gap:8px;align-items:flex-end;height:130px;padding-top:16px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.col i{display:block;width:100%;min-height:4px;background:#C9D8FF;border-radius:8px 8px 4px 4px;transition:height .6s}
.col.today i{background:var(--accent)}
.col small{font-size:12px;color:var(--muted);font-weight:800}
.cv{font-size:11.5px;color:var(--muted);font-weight:800;min-height:14px}
.challenge{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin-top:16px;background:var(--group);border-radius:14px;padding:10px 12px}
.challenge small{display:block;color:var(--muted);font-size:12.5px}
.ch-bar{grid-column:1;height:10px;background:#fff;border-radius:99px;overflow:hidden}
.ch-bar i{display:block;height:100%;background:var(--purple);border-radius:99px}
.challenge>span{grid-row:1/span 2;grid-column:2;font-weight:900}
.quest{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--group)}
.quest:first-of-type{border-top:0}
.q-e{width:42px;height:42px;border-radius:12px;background:var(--group);display:grid;place-items:center;font-size:22px;flex:none}
.q-m{flex:1}
.q-m b{font-size:15px}
.q-bar{height:12px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:6px}
.q-bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s}
.quest.ok .q-bar i{background:var(--green)}
.q-v{font-weight:900;color:var(--muted);min-width:40px;text-align:right}
.quest.ok .q-v{color:var(--green)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge2{border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;opacity:.6}
.badge2.got{opacity:1;border-color:#FFD66B;background:#FFFBEA}
.badge2 span{font-size:34px;display:block}
.badge2 b{display:block;font-size:14.5px}
.badge2 small{color:var(--muted);font-size:12px;line-height:1.3;display:block}

/* Profil */
.prof-head{display:flex;gap:14px;align-items:center;margin:8px 0 16px}
.prof-av{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;border:3px solid #CFDDFF}
.prof-av svg{width:54px;height:54px}
.prof-head h2{margin:0;font-size:26px}
.prof-head p{margin:0;color:var(--muted);font-size:14px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pstats div{border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.pstats b{display:block;font-size:22px}
.pstats small{color:var(--muted);font-size:12px}
.sp-row2{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.sp-dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.sp-row2>div{flex:1}
.sp-row2 small{display:block;color:var(--muted);font-size:12.5px}
.sp-bar{height:8px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:6px}
.sp-bar i{display:block;height:100%;border-radius:99px}
.settings .seg button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:7px 2px}
.settings .seg button small{font-size:10.5px;color:var(--muted);font-weight:700}
.set-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-weight:800}
.set-det{margin-top:14px}
.set-det summary{font-weight:800}

/* Anpassungen bestehender Elemente */
.msg.assistant{background:var(--group)}
.seg{background:var(--fill);border-radius:14px;padding:3px}
.seg button{border-radius:11px;font-weight:800}
.card{border:2px solid var(--line);border-radius:20px}
.flash{border-radius:22px;box-shadow:0 5px 0 var(--line)}
.btn{border-radius:14px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.ghost{box-shadow:0 3px 0 var(--line)}
.spk{background:var(--accent-soft);color:var(--accent)}
.notice{margin:8px 16px}

.modal{z-index:55}
.toast{z-index:70}
.saypop{z-index:58}

.opt.right{border-color:var(--green);background:var(--ok-soft);color:var(--green-d);box-shadow:0 4px 0 var(--green)}
.opt.wrongc{border-color:var(--red);background:var(--bad-soft);color:var(--red-d);box-shadow:0 4px 0 var(--red);animation:shake .35s}

  function flagsLine(){
    const L = (window.LEL_LANGS || []).map(x => x.flag);
    return L.length ? `<span class="lel-flags">${L.join(" ")}</span>` : "🌍";
  }
  function showLogin(){
    let mode = "login";
    const o = overlay("", `<div class="lel-box">
      <img class="lel-mascot" src="${LOGO}" alt="" width="96" height="96">
      <div class="lel-logo" aria-hidden="true">${flagsLine()}</div>
      <h1>LearnEasyLanguage</h1>
      <p>Sprachen lernen – auf Deutsch erklärt.</p>
      ${configured ? `
      <div class="lel-seg" role="tablist">
        <button type="button" data-m="login" class="on">Anmelden</button>
        <button type="button" data-m="register">Konto erstellen</button>
      </div>
      <form id="lelForm" novalidate>
        <label class="lel-f"><span>Benutzername</span><input id="lelU" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" required></label>
        <label class="lel-f"><span>Passwort</span><input id="lelP" type="password" autocomplete="current-password" maxlength="72" required></label>
        <label class="lel-f" id="lelP2w" hidden><span>Passwort wiederholen</span><input id="lelP2" type="password" autocomplete="new-password" maxlength="72"></label>
        <button class="lel-btn" id="lelGo">Anmelden</button>
        <p class="lel-err" id="lelErr" role="alert"></p>
      </form>
      <p class="lel-hint" id="lelHint">Passwort vergessen? Melde dich beim Admin – er kann es zurücksetzen.</p>`
      : `<p class="lel-err">Die App ist noch nicht mit dem Server verbunden.</p>`}
    </div>`);
    if(!configured) return;
    const $ = s => o.querySelector(s);
    const setMode = m => {
      mode = m;
      o.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === m));
      $("#lelP2w").hidden = m !== "register";
      $("#lelGo").textContent = m === "register" ? "Konto erstellen" : "Anmelden";
      $("#lelP").autocomplete = m === "register" ? "new-password" : "current-password";
      $("#lelHint").textContent = m === "register"
        ? "Benutzername: 3–20 Zeichen (a–z, 0–9, . _ -). Passwort: mindestens 6 Zeichen. Hinweis: Der Admin dieser App kann deinen Lernfortschritt sehen, aber nie dein Passwort."
        : "Passwort vergessen? Melde dich beim Admin – er kann es zurücksetzen.";
      $("#lelErr").textContent = "";
    };
    o.querySelectorAll("[data-m]").forEach(b => b.onclick = () => setMode(b.dataset.m));
    $("#lelForm").onsubmit = async e => {
      e.preventDefault();
      const u = $("#lelU").value.trim(), p = $("#lelP").value;
      const err = $("#lelErr");
      if(!u || !p){ err.textContent = "Bitte Benutzername und Passwort eingeben."; return; }
      if(mode === "register" && p !== $("#lelP2").value){ err.textContent = "Die Passwörter stimmen nicht überein."; return; }
      $("#lelGo").disabled = true; err.textContent = "";
      try{
        const res = await rpc(mode === "register" ? "app_register" : "app_login", {p_username: u, p_password: p});
        signedIn(res);
      }catch(x){ err.textContent = x.message || "Das hat nicht geklappt."; $("#lelGo").disabled = false; }
    };
    setTimeout(() => { try{ $("#lelU").focus(); }catch(e){} }, 50);
  }

  function showWelcome(){
    ss.del(W_KEY);
    const name = user();
    const o = overlay("lel-welcome", `<img class="lel-mascot big" src="${LOGO}" alt="" width="148" height="148">
      <div class="lel-logo" aria-hidden="true">${flagsLine()}</div>
      <h1>Herzlich willkommen bei LearnEasyLanguage</h1>
      <p>Schön, dass du da bist${name ? ", " + esc(name) : ""}.</p>
      <small>Tippen, um zu starten</small>`);
    o.setAttribute("role", "button");
    o.tabIndex = 0;
    const close = () => o.remove();
    o.onclick = close;
    o.onkeydown = e => { if(e.key === "Enter" || e.key === " " || e.key === "Escape") close(); };
    setTimeout(() => o.focus(), 50);
  }

  function fmt(t){
    if(!t) return "–";
    const d = new Date(t);
    return d.toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit", year: "numeric"}) + ", " + d.toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});
  }

  function otherLangs(m){
    const ks = Object.keys(m || {});
    if(!ks.length) return "";
    const fl = c => ((window.LEL_LANGS || []).find(x => x.code === c) || {flag: c}).flag;
    return `<div class="meta">Weitere Sprachen: ${ks.map(k => fl(k) + " " + (m[k] | 0) + " XP").join(" · ")}</div>`;
  }
  async function showAdmin(){
    const o = overlay("lel-admin", `<div class="lel-box">
      <div class="lel-top"><h1 style="margin:0">Admin-Bereich</h1><button type="button" id="lelClose">Schließen</button></div>
      <p id="lelSum">Lade Benutzer …</p>
      <div id="lelList"></div>
    </div>`);
    o.querySelector("#lelClose").onclick = () => o.remove();
    const list = o.querySelector("#lelList"), sum = o.querySelector("#lelSum");
    async function load(){
      try{
        const users = await rpc("app_admin_users", {p_token: token()}) || [];
        sum.textContent = users.length === 1 ? "1 Benutzer" : users.length + " Benutzer";
        list.innerHTML = users.map(u => `<div class="lel-u" data-u="${esc(u.username)}">
          <b>${esc(u.username)}</b>${u.is_admin ? `<span class="tag">Admin</span>` : ""}
          <div class="meta">Registriert: ${fmt(u.created_at)} · Zuletzt da: ${fmt(u.last_login)}</div>
          ${otherLangs(u.langs)}
          <div class="nums">
            <div><b>${u.xp}</b><small>XP 🇵🇹</small></div>
            <div><b>${u.streak}</b><small>Serie</small></div>
            <div><b>${u.words}</b><small>Wörter</small></div>
            <div><b>${u.stations}</b><small>Stationen</small></div>
          </div>
          <div class="acts">
            <button type="button" data-a="pw">Passwort zurücksetzen</button>
            ${u.is_admin ? "" : `<button type="button" class="bad" data-a="del">Löschen</button>`}
          </div>
        </div>`).join("");
        list.querySelectorAll(".lel-u").forEach(card => {
          const name = card.dataset.u;
          const pwBtn = card.querySelector('[data-a="pw"]');
          pwBtn.onclick = () => {
            if(card.querySelector("form")) return;
            const f = document.createElement("form");
            f.innerHTML = `<input type="text" placeholder="Neues Passwort (mind. 6)" maxlength="72" autocomplete="off" autocapitalize="none"><button>Setzen</button>`;
            card.appendChild(f);
            f.querySelector("input").focus();
            f.onsubmit = async e => {
              e.preventDefault();
              const pw = f.querySelector("input").value;
              try{
                await rpc("app_admin_reset_password", {p_token: token(), p_username: name, p_new: pw});
                f.outerHTML = `<p class="meta" style="color:#1E8E4E;margin-top:8px">Neues Passwort gesetzt. Gib es ${esc(name)} weiter.</p>`;
              }catch(x){ alert(x.message); }
            };
          };
          const del = card.querySelector('[data-a="del"]');
          if(del) del.onclick = async () => {
            if(!confirm(`Konto „${name}“ mit allem Fortschritt löschen? Das lässt sich nicht rückgängig machen.`)) return;
            try{ await rpc("app_admin_delete_user", {p_token: token(), p_username: name}); load(); }
            catch(x){ alert(x.message); }
          };
        });
      }catch(x){ sum.textContent = x.message || "Konnte die Benutzer nicht laden."; }
    }
    load();
  }

  function changePassword(){
    const o = overlay("", `<div class="lel-box">
      <h1>Passwort ändern</h1><p>Angemeldet als ${esc(user())}</p>
      <form id="lelCp">
        <label class="lel-f"><span>Aktuelles Passwort</span><input id="cpO" type="password" autocomplete="current-password"></label>
        <label class="lel-f"><span>Neues Passwort</span><input id="cpN" type="password" autocomplete="new-password" maxlength="72"></label>
        <button class="lel-btn">Speichern</button>
        <button class="lel-btn sec" type="button" id="cpX">Abbrechen</button>
        <p class="lel-err" id="cpE" role="alert"></p>
      </form></div>`);
    o.querySelector("#cpX").onclick = () => o.remove();
    o.querySelector("#lelCp").onsubmit = async e => {
      e.preventDefault();
      try{
        await rpc("app_change_password", {p_token: token(), p_old: o.querySelector("#cpO").value, p_new: o.querySelector("#cpN").value});
        o.querySelector(".lel-box").innerHTML = `<h1>Gespeichert</h1><p>Dein Passwort wurde geändert. Andere Geräte sind jetzt abgemeldet.</p><button class="lel-btn" id="cpOk">Fertig</button>`;
        o.querySelector("#cpOk").onclick = () => o.remove();
      }catch(x){ o.querySelector("#cpE").textContent = x.message; }
    };
  }

  async function logout(){
    try{ await rpc("app_logout", {p_token: token()}); }catch(e){}
    ls.del(T_KEY); ls.del(A_KEY); clearStates();
    location.reload();
  }

  /* Konto-Karte im Profil */
  function renderProfileExtras(view){
    if(!token()) return;
    const card = document.createElement("div");
    card.className = "lel-card";
    card.innerHTML = `<h3>Konto</h3><div class="muted">Angemeldet als <b>${esc(user())}</b>${isAdmin() ? " · Admin" : ""}. Dein Fortschritt wird automatisch in deinem Konto gespeichert.</div>
      ${isAdmin() ? `<button class="lel-btn" type="button" data-k="admin" style="margin-top:12px">Admin-Bereich öffnen</button>` : ""}
      <div class="row"><button class="lel-btn sec" type="button" data-k="pw">Passwort ändern</button><button class="lel-btn bad" type="button" data-k="out">Abmelden</button></div>`;
    const head = view.querySelector(".pstats");
    if(head && head.nextSibling) view.insertBefore(card, head.nextSibling); else view.appendChild(card);
    card.querySelector('[data-k="pw"]').onclick = changePassword;
    card.querySelector('[data-k="out"]').onclick = () => { if(confirm("Abmelden? Dein Fortschritt bleibt in deinem Konto gespeichert.")) logout(); };
    const a = card.querySelector('[data-k="admin"]'); if(a) a.onclick = showAdmin;
  }

  function openTutor(){
    if(confirm("Der KI-Lehrer läuft in der Claude-Version der App. Dafür brauchst du ein (kostenloses) Claude-Konto. Jetzt öffnen?")){
      window.open(CFG.tutor, "_blank", "noopener");
    }
  }

  /* Start */
  function boot(){
    addStyle();
    if(!token()) showLogin();
    else if(ss.get(W_KEY)) showWelcome();
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

  return { active: () => configured && !!token(), doc, user, isAdmin, renderProfileExtras, openTutor, showAdmin };
})();

CHEATS: [
 ["Aussprache in Spanien", `- **c** vor e/i und **z** klingen in den meisten Teilen Spaniens wie das englische „th“: **gracias**, **cerveza**. In Lateinamerika und auf den Kanaren wie „s“.
- **j** und **g** vor e/i klingen wie „ch“ in „Bach“: **jamón**, **gente**.
- **ll** und **y** klingen wie das deutsche „j“: **llamo**, **yo**.
- **ñ** klingt wie „nj“: **España**.
- **h** spricht man nicht: **hola** [ola].
- **b** und **v** klingen gleich: **vino**, **bien**.
- **r** am Wortanfang und **rr** werden gerollt: **perro**. Ein einfaches **r** zwischen Vokalen wird nur kurz getippt: **pero**.
- Vokale sind immer klar und kurz – auch unbetont.`],
 ["Betonung & Akzent", `- Wörter auf Vokal, **-n** oder **-s** betont man auf der vorletzten Silbe: **casa**, **hablan**.
- Wörter auf anderen Konsonanten betont man auf der letzten Silbe: **hablar**, **ciudad**.
- Weicht die Betonung davon ab, steht ein Akzent: **café**, **teléfono**, **árbol**.
- Der Akzent unterscheidet auch Wörter: **sí** (ja) – **si** (wenn), **tú** (du) – **tu** (dein), **él** (er) – **el** (der).`],
 ["Artikel & Geschlecht", `- Bestimmt: **el** (m), **la** (f), **los**, **las** – unbestimmt: **un**, **una**, **unos**, **unas**.
- Wörter auf **-o** sind meist männlich, auf **-a** meist weiblich.
- Ausnahmen: **el día**, **el mapa**, **el problema**, **la mano**, **la foto**.
- Weiblich: Endungen **-ción**, **-dad**, **-tad**: **la estación**, **la ciudad**.
- Weibliche Wörter mit betontem a- am Anfang bekommen im Singular **el**: **el agua** (aber: **las aguas**, **el agua fría**).
- **a** + **el** = **al**, **de** + **el** = **del**: **Voy al cine. Soy del norte.**`],
 ["ser oder estar?", `**ser** – Wesen und Identität:
- Name, Herkunft, Beruf: **Soy Daniel. Soy de Alemania. Soy profesor.**
- Eigenschaften: **Ella es simpática.**
- Uhrzeit und Datum: **Son las tres.**

**estar** – Zustand und Ort:
- Befinden: **Estoy cansado.**
- Wo jemand oder etwas ist: **Estoy en casa. Madrid está en España.**
- Gerade dabei sein: **Estoy comiendo.**

Dass es etwas gibt, sagt man mit **hay**: **Hay un bar aquí.**`],
 ["Du, Sie & ihr", `- **tú** (du): In Spanien sehr verbreitet – auch mit Kollegen oder im Geschäft.
- **usted** (Sie): mit älteren Menschen, Behörden, in formellen Situationen. Verb in der 3. Person: **¿Cómo está usted?**
- **vosotros** (ihr): nur in Spanien. **¿Qué queréis?**
- **ustedes** (Sie, Plural): in Spanien höflich, in Lateinamerika auch für „ihr“.`],
 ["Fragen & Verneinung", `- Fragen und Ausrufe haben am Anfang ein umgedrehtes Zeichen: **¿Qué tal? ¡Qué bien!**
- Fragewörter tragen einen Akzent: **qué**, **quién**, **dónde**, **cuándo**, **cómo**, **cuánto**.
- **no** steht direkt vor dem Verb: **No hablo francés.**
- Doppelte Verneinung ist richtig: **No sé nada. No viene nadie.**`],
 ["Gerade etwas tun: estar + Gerundium", `- **estar** + Gerundium: **Estoy trabajando.** (Ich arbeite gerade.)
- Gerundium: **-ar → -ando** (**hablando**), **-er/-ir → -iendo** (**comiendo**, **viviendo**).
- **¿Qué estás haciendo?** – Was machst du gerade?`]
]
};

 ["Aussprache in Frankreich", `- Endkonsonanten spricht man meist nicht: **petit**, **vous**. Oft gesprochen werden c, r, f, l am Ende: **avec**, **bonjour**, **neuf**, **sel**.
- Ein **e** am Wortende ist stumm: **une**, **table**.
- Nasale: **an/en**, **on**, **in/un**: **enfant**, **bon**, **vin**.
- **ou** klingt wie deutsches „u“, **u** wie deutsches „ü“: **vous** – **vu**.
- **oi** klingt wie „wa“: **moi**, **trois**.
- **h** spricht man nie.
- Liaison: Ein sonst stummer Endkonsonant wird vor Vokal gesprochen: **les amis**, **vous avez**.
- Betont wird immer die letzte Silbe.`],
 ["Artikel & Geschlecht", `- Bestimmt: **le** (m), **la** (f), **les** (Plural). Vor Vokal oder stummem h: **l'** – **l'ami**, **l'eau**.

- Teilungsartikel für unbestimmte Mengen: **du pain**, **de la confiture**, **de l'eau** – nach Verneinung nur **de**: **Je ne mange pas de viande.**
- Verschmelzung: **à + le = au**, **à + les = aux**, **de + le = du**, **de + les = des**.
- Das Geschlecht muss man mitlernen: **le livre**, **la table**. Wörter auf **-tion** und **-té** sind meist weiblich.`],

- **vous** (Sie): Fremde, Geschäfte, Behörden, Arbeit – im Zweifel immer **vous**. **vous** heißt auch „ihr“.
- **on** (man) ersetzt im Alltag sehr oft **nous**: **On y va ?** (Gehen wir?)
- Höflich grüßen: **Bonjour, monsieur. Bonjour, madame.**`],
 ["Fragen stellen", `Drei Möglichkeiten, von locker bis formell:
- Nur mit der Stimme: **Tu viens ?**
- Mit **est-ce que**: **Est-ce que tu viens ?**
- Mit Umstellung, vor allem schriftlich: **Viens-tu ?**
Mit Fragewort: **Tu habites où ?** – **Où est-ce que tu habites ?** – **Où habites-tu ?**`],

- Mit **être**: Verben der Bewegung und Zustandsänderung (aller, venir, arriver, partir, entrer, sortir, naître, mourir, rester, tomber …) und alle reflexiven Verben: **Je suis allé(e). Je me suis levé(e).**
- Bei **être** richtet sich das Partizip nach dem Subjekt: **Elle est allée. Ils sont venus.**`]

CHEATS: [
 ["Aussprache", `- **sz** wie „sch“, **cz** wie „tsch“: **szkoła**, **czas**.
- **rz** und **ż** klingen gleich, wie das „g“ in „Garage“: **rzeka**, **żaba**.
- **ś**, **ć**, **ź** (auch **si**, **ci**, **zi**) sind weichere Varianten: **cześć**, **ciocia**.
- **ł** klingt wie englisches „w“: **mały**. Das **w** klingt wie deutsches „w“.
- **ą** und **ę** sind nasal: **są**, **idę** – am Wortende klingt ę oft fast wie „e“.
- **ó** klingt genau wie **u**: **mój**.
- **c** ist immer „ts“: **co**. **ch** wie in „Bach“.
- Betonung fast immer auf der vorletzten Silbe: **Polska**, **dziękuję**.`],
 ["Die sieben Fälle", `Polnisch hat sieben Fälle. Die Endung zeigt die Rolle im Satz:
- **Nominativ** (wer?): **To jest Kraków.**

- **Dativ** (wem?): **Daję bratu książkę.**
- **Akkusativ** (wen?): **Mam kota. Poproszę kawę.**
- **Instrumental** (mit wem? – nach być bei Substantiven): **Jestem studentem. Jadę z mamą.**
- **Lokativ** (wo? – nach w, na, o): **Mieszkam w Berlinie.**
- **Vokativ** (Anrede): **Panie Tomaszu!**
Am Anfang reichen feste Wendungen – die Fälle kommen Schritt für Schritt.`],

- Polnisch hat keine Artikel: **kot** = die Katze / eine Katze.
- Adjektive passen sich an: **dobry dzień**, **dobra kawa**, **dobre piwo**.`],

CHEATS: [
 ["Pronunciation (Aussprache)", `- **ch** after a, o, u like Scottish „loch“: **Buch**; after other vowels softer: **ich**.
- **sch** = „sh“: **Schule**. **sp** and **st** at the start of a word = „shp“, „sht“: **Sport**, **Straße**.
- **ei** = „ai“: **mein**; **ie** = long „ee“: **Bier**; **eu / äu** = „oy“: **heute**.
- **ä, ö, ü** are separate vowels: **Mädchen**, **schön**, **müde**.
- **ß** = sharp „s“: **Straße**. **z** = „ts“: **Zeit**. **w** = English „v“: **Wasser**. **v** usually = „f“: **Vater**.
- Final **b, d, g** sound like p, t, k: **Tag**, **Kind**.
- Stress is usually on the first syllable: **ARbeiten**.`],
 ["Articles & gender (der, die, das)", `- Three genders: **der** (masculine), **die** (feminine), **das** (neuter). Plural always **die**.
- Always learn nouns with the article: **der Tisch**, **die Lampe**, **das Buch**.
- Some patterns: **-ung, -heit, -keit, -schaft** are feminine (**die Wohnung**); **-chen, -lein** are neuter (**das Mädchen**).
- All nouns are written with a capital letter.`],
 ["Word order", `- In statements the conjugated verb is in **position 2**: **Ich lerne heute Deutsch. Heute lerne ich Deutsch.**
- Yes/no questions start with the verb: **Lernst du Deutsch?**
- In clauses with **weil, dass, wenn** the verb goes to the end: **…, weil ich müde bin.**
- Separable verbs split: **anrufen → Ich rufe dich an.**`],
 ["Cases (Fälle)", `German has four cases. The article shows the case:
- **Nominativ** (subject): **der / die / das** – **Der Mann kommt.**
- **Akkusativ** (direct object): only masculine changes: **den / einen** – **Ich sehe den Mann.**
- **Dativ** (indirect object, after mit, bei, zu, von, aus …): **dem / der / dem** – **mit dem Bus**
- **Genitiv** (possession, mostly written): **des / der / des** – **das Auto des Mannes**`],
 ["du or Sie?", `- **du**: family, friends, children, often among young people and colleagues.
- **Sie** (capital S): strangers, shops, offices, formal situations. The verb takes the plural form: **Kommen Sie?**
- **ihr**: you (plural, informal).`],
 ["nicht or kein?", `- **kein / keine** negates nouns with ein or without article: **Ich habe kein Auto. Ich habe keine Zeit.**
- **nicht** negates everything else: **Ich komme nicht. Das ist nicht gut. Ich sehe den Film nicht.**`]

function scheduleSave(){

}
async function flush(){
  if(!docRef || saving || !dirty) return;
  saving = true; dirty = false;
  try{ await docRef.set(JSON.parse(JSON.stringify(state))); }
  catch(e){
    const c = e && e.code;
    if(c === "unavailable" || c === "resource_exhausted") dirty = true;
    else if(c === "invalid_argument" || c === "revoked" || c === "not_granted"){ docRef = null; }
  }
  saving = false;
  if(dirty) saveTimer = setTimeout(flush, 2500);
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<b class="pt">$1</b>')
    .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\*)/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function md(src){
  const lines = String(src).split(/\r?\n/); let html = "", list = null;
  const close = () => { if(list){ html += `</${list}>`; list = null; } };
  for(const raw of lines){
    const line = raw.trimEnd(); let m;
    if(!line.trim()){ close(); continue; }
    if((m = line.match(/^\s*[-*•]\s+(.*)/))){ if(list !== "ul"){ close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; continue; }
    if((m = line.match(/^\s*(\d+)[.)]\s+(.*)/))){ if(list !== "ol"){ close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[2])}</li>`; continue; }
    close();
    if((m = line.match(/^#{1,4}\s+(.*)/))){ html += `<h4>${inline(m[1])}</h4>`; continue; }
    if(/^-{3,}$/.test(line.trim())){ html += "<hr>"; continue; }
    html += `<p>${inline(line)}</p>`;
  }
  close(); return html;
}
function ptSegments(text){
  return [...String(text).matchAll(/\*\*(.+?)\*\*/g)]
    .map(m => m[1].replace(/\[[^\]]*\]/g,"").replace(/^(Frage|Aufgabe|Übung)\s*\d*:?$/i,"").trim())
    .filter(s => s && /[a-zà-ú]/i.test(s));
}
function dayKey(t){ const d = new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function touchDay(){
  const s = state.stats, t = dayKey(Date.now());
  if(s.lastDay === t) return;
  s.streak = s.lastDay === dayKey(Date.now() - DAY) ? (s.streak || 0) + 1 : 1;
  s.lastDay = t;
}

const lvlIdx = l => LEVELS.indexOf(l);
function isUnlocked(id){
  if(state.completed.includes(id)) return true;
  const i = FLAT.findIndex(x => x.id === id); if(i < 0) return false;
  const L = FLAT[i];
  if(lvlIdx(L.level) < lvlIdx(state.level)) return true;
  if(i === 0) return true;
  if(state.completed.includes(FLAT[i-1].id)) return true;
  if(L.level === state.level && FLAT.findIndex(x => x.level === state.level) === i) return true;
  return false;
}
function nextLesson(){
  return FLAT.find(x => !state.completed.includes(x.id) && isUnlocked(x.id) && lvlIdx(x.level) >= lvlIdx(state.level))
      || FLAT.find(x => !state.completed.includes(x.id) && isUnlocked(x.id)) || null;
}

let sysVoices = [];
function loadVoices(){ try{ sysVoices = (window.speechSynthesis && window.speechSynthesis.getVoices()) || []; }catch(e){ sysVoices = []; } }

  loadVoices();
  try{ window.speechSynthesis.addEventListener("voiceschanged", () => { loadVoices(); const el = document.getElementById("voiceSet"); if(el) renderVoiceSettings(); }); }catch(e){}
}
const isPT = v => LANG.ttsRe.test(v.lang);
const ptVoices = () => { const pt = sysVoices.filter(isPT); return pt.length ? pt : sysVoices.filter(v => String(v.lang).toLowerCase().startsWith(LANG.prefix)); };
const F_RE = P.F_RE || /joana|catarina|helia|in[eê]s|fernanda|female|feminin|mulher|woman|sfs|jfb/i;
const M_RE = P.M_RE || /duarte|cristiano|\bmale\b|masculin|homem|\bman\b|pmj|jmn/i;
const CLAUDE_VOICES = ["buttery","airy","glassy","rounded"];
function vset(){ const st = settings(); return st; }
function resolveVoice(g){
  const want = vset()["voice_" + g], pv = ptVoices();
  if(want){
    if(want.startsWith("sys:")){ const v = pv.find(v => "sys:" + v.voiceURI === want); if(v) return {sys:v}; }
    else if(want.startsWith("claude:") && tts) return {claude:want.slice(7)};
  }
  const re = g === "f" ? F_RE : M_RE, anti = g === "f" ? M_RE : F_RE;
  const pp = pv.filter(isPT);
  if(pp.length){
    const m = pp.find(v => re.test(v.name) && !anti.test(v.name)); if(m) return {sys:m};
    const neutral = pp.filter(v => !anti.test(v.name));
    if(pp.length > 1) return {sys: neutral[g === "f" ? 0 : neutral.length - 1] || pp[g === "f" ? 0 : 1]};
    if(!tts) return {sys:pp[0]};
  }
  if(tts) return {claude: g === "f" ? "airy" : "rounded"};
  if(pv.length){ const m = pv.find(v => re.test(v.name) && !anti.test(v.name)); return {sys: m || pv[g === "f" ? 0 : Math.min(1, pv.length - 1)]}; }
  return null;
}

let unlockAudio = null;
function audioUnlock(){
  try{
    if(!unlockAudio){ unlockAudio = new Audio(SILENT_WAV); unlockAudio.loop = true; unlockAudio.setAttribute("playsinline", ""); unlockAudio.volume = 0.01; }
    if(unlockAudio.paused){ const p = unlockAudio.play(); if(p && p.catch) p.catch(() => {}); }
    if(window.speechSynthesis && window.speechSynthesis.paused) window.speechSynthesis.resume();
  }catch(e){}

let lastSpeak = {engine:"", ok:null, error:""};
let lastTrouble = 0;
function audioTrouble(msg){ if(Date.now() - lastTrouble < 90000) return; lastTrouble = Date.now(); toast(msg || "Kein Ton? Prüfe Lautstärke und Stummschalter. Hilfe: Profil → Stimmen & Ton testen."); }
function speakSys(text, rate, gender, rv){
  audioUnlock();
  const ss = window.speechSynthesis;
  try{ if(ss.speaking || ss.pending) ss.cancel(); }catch(e){}
  try{ if(ss.paused) ss.resume(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  let v = rv && rv.sys;
  if(!v){ loadVoices(); v = ptVoices()[0]; }
  if(v){ try{ u.voice = v; }catch(e){} u.lang = v.lang; } else u.lang = LANG.tts;
  const other = resolveVoice(gender === "f" ? "m" : "f");
  const same = !v || (other && other.sys === v);
  u.pitch = same ? (gender === "m" ? 0.7 : 1.25) : 1;
  u.rate = rate;
  let started = false;
  lastSpeak = {engine:"Gerätestimme" + (v ? " (" + v.name + ")" : ""), ok:null, error:""};
  u.onstart = () => { started = true; lastSpeak.ok = true; };
  u.onerror = e => { const er = e && e.error; if(er && er !== "interrupted" && er !== "canceled"){ lastSpeak.ok = false; lastSpeak.error = er; audioTrouble("Vorlesen hat nicht geklappt. Hilfe: Profil → Stimmen & Ton testen."); } };
  ss.speak(u);
  setTimeout(() => { if(!started && !ss.speaking && lastSpeak.ok !== false){ lastSpeak.ok = false; lastSpeak.error = "kein Start"; audioTrouble(); } }, 3000);
}
async function speakPT(text, rate, gender){
  rate = rate || 0.9;
  gender = gender || vset().voiceDefault || "f";
  text = String(text).replace(/\s*…\s*/g, " ").slice(0, 1900).trim(); if(!text) return;
  const rv = resolveVoice(gender);
  const hasSys = "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance !== "undefined";
  if(rv && rv.sys && hasSys){ speakSys(text, rate, gender, rv); return; }
  if(tts){
    const voice = (rv && rv.claude) || (gender === "f" ? "airy" : "rounded");
    for(const lang of [LANG.tts, LANG.prefix]){
      try{ lastSpeak = {engine:"Claude-Stimme", ok:null, error:""}; await tts.speak(text, {language:lang, rate, voice}); lastSpeak.ok = true; return; }
      catch(e){
        const c = e && e.code; lastSpeak = {engine:"Claude-Stimme", ok:false, error:c || "Fehler"};
        if(c === "viewer_stopped") return;
        if(c === "busy"){ toast("Gerade nicht möglich – das Mikrofon ist aktiv."); return; }
        if(c === "rate_limited"){ toast("Kurz warten, dann nochmal versuchen."); return; }
        if(c === "not_granted"){ tts = null; break; }
      }
    }
  }
  if(hasSys){ speakSys(text, rate, gender, null); return; }
  lastSpeak = {engine:"keine", ok:false, error:"nicht unterstützt"};
  audioTrouble("Dieses Gerät kann hier leider nicht vorlesen. Öffne die App im Browser (Safari oder Chrome).");
}

function systemPrompt(){
  return `Du bist der persönliche Portugiesisch-Lehrer von ${state.name} in seiner Lern-App. Du begleitest ihn langfristig vom Anfänger bis C1. Sein Ziel: eines Tages natürlich, grammatikalisch korrekt und fließend mit Menschen aus Portugal sprechen.

SPRACHE
- Ausschließlich EUROPÄISCHES Portugiesisch (Portugal). Nie brasilianisches als Standard (also: tu statt você im Alltag, estar a + Infinitiv statt Gerundium, Enklise wie "chamo-me", Wörter wie pequeno-almoço, autocarro, comboio, telemóvel, casa de banho, fixe). Auf Unterschiede zu Brasilien darfst du kurz hinweisen.
- Zeige echte Alltagssprache in Portugal und erkläre den Unterschied zwischen formell und umgangssprachlich.
- Schreib zu jedem portugiesischen Beispiel die deutsche Übersetzung in Klammern dahinter.
- Erkläre auf Deutsch. Verwende Portugiesisch umso häufiger, je besser er wird (A1 fast nur Deutsch für Erklärungen, ab B1 überwiegend Portugiesisch).

KORREKTHEIT (höchste Priorität – er soll nichts Falsches lernen)
- Norm: europäisches Standardportugiesisch, Rechtschreibung nach dem Acordo Ortográfico 1990 in der portugiesischen Form (z. B. ação, ótimo, direção, receção, elétrico – aber facto, contacto).
- Prüfe vor dem Senden JEDE portugiesische Zeile: Rechtschreibung, Akzente (á, à, â, ã, é, ê, í, ó, ô, õ, ú, ç), Genus und Artikel, Angleichung von Adjektiven, Konjugation, Präpositionen, Pronomenstellung (im Hauptsatz nach dem Verb: vejo-te, chamo-me; davor nach não, que, já, também, nunca, Fragewörtern: não te vejo).
- Keine brasilianischen Formen als Standard: nicht "eu te amo" sondern "amo-te", nicht "estou fazendo" sondern "estou a fazer", nicht ônibus/trem/celular/café da manhã/banheiro/legal/garota/time, sondern autocarro/comboio/telemóvel/pequeno-almoço/casa de banho/fixe/rapariga/equipa.
- Umgangssprache immer als umgangssprachlich kennzeichnen und die neutrale Form dazu nennen.
- Wenn du dir bei einer Form oder Bedeutung nicht sicher bist, sag das offen, statt zu raten.
- Wenn du merkst, dass du selbst einen Fehler gemacht hast, korrigiere ihn sofort ausdrücklich.

GESAMMELTE WÖRTER
- Die App sammelt automatisch jedes portugiesische Wort aus euren Gesprächen und übersetzt jedes deutsche Wort, das er schreibt, in seinen Vokabeltrainer (neuGesammelteWoerter). Du musst dafür nichts tun.
- Bring ihm diese Wörter aktiv bei: Erkläre neue Wörter kurz, baue sie in Übungen, Wiederholungen und Rollenspiele ein und frag sie in späteren Nachrichten wieder ab.

EINPRÄGEN
- Gib bei neuen Wörtern kurze Eselsbrücken (Ähnlichkeit zum Deutschen, Englischen oder Bilder im Kopf), wenn sie sinnvoll sind.
- Verwende neue Wörter in den folgenden Übungen und Nachrichten wieder (aktive Wiederholung). Frage regelmäßig ältere Wörter ab, besonders die schwachen.
- Lass ihn lieber selbst Sätze bauen als nur lesen.

FORMAT (wichtig, die App ist für das Handy)
- Schreibe JEDES portugiesische Wort und jeden portugiesischen Satz **fett**. Nichts Deutsches fett. Die App liest fett Gedrucktes auf Portugiesisch vor.
- Aussprache als deutsche Annäherung in eckigen Klammern, betonte Silbe in Großbuchstaben, z. B. **obrigado** [o-bri-GA-du]. Erkläre portugiesische Besonderheiten: unbetonte Vokale fast verschluckt, s/z am Silbenende wie "sch", ão, lh, nh, r/rr.
- Kurz halten: höchstens ca. 150 Wörter pro Nachricht. Immer nur EIN Schritt bzw. EINE Frage pro Nachricht, dann auf die Antwort warten.
- Keine riesigen Vokabellisten (höchstens 5–8 neue Wörter pro Lektion, die er aktiv anwendet).
- Verrate Lösungen von Übungen nicht sofort. Gib bei Bedarf einen Tipp.

LEKTIONEN (wenn eine Lektion gestartet wird, verteilt über mehrere Nachrichten)
1. Wiederholung (frage Dinge aus früheren Lektionen / schwache Vokabeln ab), 2. Neues Thema, 3. Vokabeln, 4. Beispielsätze, 5. Aussprache, 6. Übungen (er bildet selbst Sätze), 7. Korrektur, 8. Abschlusstest (ca. 5 Aufgaben).
Eine Lektion gilt nur als abgeschlossen, wenn er im Abschlusstest mindestens 80 % schafft – sonst wiederhole die Schwachstellen. Überspringe keine Grundlagen.

FEHLERKORREKTUR (anspruchsvoll, aber geduldig; lass ihn nie mit falschem Portugiesisch weitermachen)
❌ Deine Antwort: …
✅ Richtig: **…**
💡 Warum: (Erklärung auf Deutsch)
➕ Noch ein Beispiel: **…**
🔁 Jetzt du: (lass ihn den Satz selbst noch einmal richtig schreiben)

ROLLENSPIELE
Bleib in deiner Rolle und sprich Portugiesisch auf seinem Niveau (bei A1 sehr einfache Sätze, bei Bedarf deutsche Übersetzung in Klammern). Steigere langsam. Fordere ihn auf, selbstständig zu antworten. Bei einem Fehler: kurz unterbrechen mit "✏️ Korrektur:" auf Deutsch, dann in der Rolle weiter.

EINSTUFUNGSTEST
Solange einstufungAbgeschlossen = false: führe den Test fort (insgesamt ca. 8 Fragen, eine pro Nachricht, steigende Schwierigkeit von A1 bis B1, auch Verstehen und eigene Sätze). Danach: rufe update_progress auf (level, placementDone: true, strengths, weaknesses, notes), stelle seinen persönlichen Lernplan kurz vor und biete an, mit der ersten passenden Lektion zu starten.

FORTSCHRITT SPEICHERN – nutze das Tool update_progress:
- neue Vokabeln einer Lektion (addVocab, Portugiesisch mit Artikel bei Nomen),
- neu gelernte Grammatik (addGrammar), wiederkehrende Fehler (addMistakes, kurz auf Deutsch),
- Lektion bestanden (completeLesson mit der ID), Niveauwechsel erst, wenn der Abschlusstest der Stufe bestanden ist,
- aktualisierte Stärken/Schwächen und eine kurze Notiz, wo ihr gerade steht (notes).
Erwähne das Speichern nicht ausführlich.

LEHRPLAN (IDs):
${curriculumText()}

AKTUELLER LERNSTAND:
${profileJSON()}`;
}

function applyProgress(p){
  const msgs = [];
  if(p.level && LEVELS.includes(p.level) && p.level !== state.level){ state.level = p.level; msgs.push("Niveau " + p.level); }
  if(typeof p.placementDone === "boolean") state.placementDone = p.placementDone;
  if(p.completeLesson && FLAT.some(x => x.id === p.completeLesson) && !state.completed.includes(p.completeLesson)){
    state.completed.push(p.completeLesson); msgs.push("✅ Lektion " + p.completeLesson + " bestanden");
    if(state.currentLesson === p.completeLesson) state.currentLesson = null;
  }
  if(p.currentLesson && FLAT.some(x => x.id === p.currentLesson)) state.currentLesson = p.currentLesson;
  if(Array.isArray(p.addVocab)){
    let n = 0;
    p.addVocab.slice(0, 15).forEach(v => {
      if(!v || !v.pt || !v.de) return;
      const key = String(v.pt).trim().toLowerCase();
      if(state.vocab.some(x => x.pt.toLowerCase() === key)) return;
      state.vocab.push({pt:String(v.pt).trim(), de:String(v.de).trim(), theme:null, box:1, due:Date.now() + 10*60000}); n++;
    });
    if(n) msgs.push("+" + n + " Vokabeln");
  }
  if(false && Array.isArray(p.addErrorCards)){
    let n = 0;
    p.addErrorCards.slice(0, 3).forEach(c => {
      if(!c || !c.falsch || !c.richtig) return;
      const r = String(c.richtig).trim().slice(0, 160), w = String(c.falsch).trim().slice(0, 160);
      if(normalize(r) === normalize(w)) return;
      if(state.vocab.some(x => x.pt.toLowerCase() === r.toLowerCase())) return;
      state.vocab.push({pt:r, de:"Korrektur von: " + w, wrong:w, why:String(c.erklaerung || "").slice(0, 300), kind:"fix", box:1, due:Date.now() + 10*60000}); n++;
    });
    if(n) msgs.push("+" + n + (n === 1 ? " Fehlerkarte" : " Fehlerkarten"));
  }
  if(Array.isArray(p.addGrammar)) p.addGrammar.forEach(g => { if(g && !state.grammar.includes(g)) state.grammar.push(String(g)); });
  if(Array.isArray(p.addMistakes)) p.addMistakes.forEach(m => { if(m){ state.mistakes = [String(m)].concat(state.mistakes.filter(x => x !== m)).slice(0, 30); } });
  if(Array.isArray(p.strengths)) state.strengths = p.strengths.map(String).slice(0, 8);
  if(Array.isArray(p.weaknesses)) state.weaknesses = p.weaknesses.map(String).slice(0, 8);
  if(typeof p.notes === "string") state.notes = p.notes.slice(0, 600);

  if(msgs.length) toast("📈 " + msgs.join(" · "));
}
function buildMessages(){

  const out = [];
  raw.forEach(m => { const last = out[out.length-1]; if(last && last.role === m.role) last.content += "\n\n" + m.content; else out.push({role:m.role, content:m.content}); });

}
