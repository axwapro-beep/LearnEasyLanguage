  v.querySelectorAll("[data-acc]").forEach(x => x.onclick = () => { const i = g("exAns"); const a = i.selectionStart ?? i.value.length, b2 = i.selectionEnd ?? i.value.length; i.value = i.value.slice(0, a) + x.dataset.acc + i.value.slice(b2); ex.answer = i.value; i.focus(); i.setSelectionRange(a + 1, a + 1); });
  const finish = r => { ex.result = r; if(r === "bad") state.stats.exWrong = (state.stats.exWrong || 0) + 1; else state.stats.exRight = (state.stats.exRight || 0) + 1; touchDay(); scheduleSave(); renderPractice(); };
  if(g("exCheck")) g("exCheck").onclick = () => {

  if(g("exNext")) g("exNext").onclick = () => newExercise(ex.kind);
}

/* ---------- vocab: trainer, themes, dictionary ---------- */
const BOX_MS = [0, 0, 10*60000, DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];
const MAXBOX = 7, GOAL = 50;
const reps = c => c.reps || 0;
const learned = c => reps(c) >= GOAL;
function repInterval(r){ return r < 3 ? 60000 : r < 6 ? 10*60000 : r < 15 ? 60*60000 : r < 30 ? 6*3600000 : r < GOAL ? DAY : 30*DAY; }
let vTab = "train", vMode = "mix", card = null, cardKind = "type", cardDir = "de2pt", answered = null, choices = null, introInfo = null;
let dictQuery = "", dictSel = null, dictState = null;

function normalize(s){ return String(s).toLowerCase().replace(/\([^)]*\)/g," ").replace(/[.,!?¿¡;:"'«»„“…]/g,"").replace(/\s+/g," ").trim(); }
function stripAcc(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,""); }
function variants(s){ const base = String(s).replace(/\([^)]*\)/g," "); return base.split(/\s*[\/;,]\s*/).map(normalize).filter(Boolean).concat([normalize(base)]); }
const noArt = x => x.replace(P.ART_RE || /^(o|a|os|as|um|uma|der|die|das|ein|eine|einen) /,"");
function checkAnswer(ans, target){
  const a = normalize(ans); if(!a) return "wrong";
  const vs = variants(target);
  if(vs.includes(a)) return "ok";
  if(vs.some(v => stripAcc(v) === stripAcc(a))) return "accent";
  if(vs.some(v => noArt(stripAcc(v)) === noArt(stripAcc(a)))) return "article";
  return "wrong";
}
function settings(){ if(!state.settings) state.settings = {newPerDay:10}; return state.settings; }
function newLeft(){
  const s = state.stats, t = dayKey(Date.now());
  if(s.newDay !== t){ s.newDay = t; s.newToday = 0; }
  return Math.max(0, settings().newPerDay - (s.newToday || 0));
}
const newCount = () => state.vocab.filter(v => !v.box).length;
const dueCount = () => { const now = Date.now(); return state.vocab.filter(v => v.box >= 1 && (v.due || 0) <= now).length; };
const randOf = a => a[Math.floor(Math.random() * a.length)];

function pickCard(force){
  const now = Date.now();
  const dueAll = state.vocab.filter(v => v.box >= 1 && (v.due || 0) <= now);
  const due = dueAll.filter(v => v !== card);
  if(due.length){ due.sort((a,b) => (reps(a) - reps(b)) || ((a.due||0) - (b.due||0))); return randOf(due.slice(0, 5)); }
  if(newLeft() > 0){ const nw = state.vocab.find(v => !v.box && v !== card); if(nw) return nw; }
  if(dueAll.length) return dueAll[0];
  if(force){
    const pool = state.vocab.filter(v => v.box >= 1 && v !== card && !learned(v)).sort((a,b) => reps(a) - reps(b));
    if(pool.length) return randOf(pool.slice(0, 8));
  }
  return null;
}
function setupCard(c){
  card = c; answered = null; choices = null; introInfo = null;
  if(!c) return;
  if(c.kind === "fix"){ cardKind = "fix"; return; }
  if(!c.box){ cardKind = "intro"; cardDir = "pt2de"; return; }
  cardKind = "type"; cardDir = vMode === "mix" ? (Math.random() < .5 ? "de2pt" : "pt2de") : vMode;
}
function makeChoices(c){
  const field = cardDir === "de2pt" ? "pt" : "de", right = c[field];
  const pool = DICT.concat(state.vocab.filter(e => e.kind !== "fix")).filter(e => e[field] !== right && e.pt.toLowerCase() !== c.pt.toLowerCase());
  const same = pool.filter(e => c.theme && e.theme === c.theme);
  const from = same.length >= 3 ? same : pool;
  const opts = new Set(); let guard = 0;
  while(opts.size < 3 && guard++ < 300){ const e = randOf(from); if(e) opts.add(e[field]); }
  return {right, opts:[...opts, right].sort(() => Math.random() - .5)};
}
function nextCard(force){
  setupCard(pickCard(force)); renderVocab();
  const inp = $("#vAns"); if(inp && !answered) inp.focus({preventScroll:true});
}
function grade(result){
  if(!card) return;
  card.box = Math.max(1, card.box || 1);
  if(result === "ok"){
    card.reps = reps(card) + 1; state.stats.right++; card.right = (card.right || 0) + 1; card.last = Date.now(); addXP(1);
    card.due = Date.now() + repInterval(card.reps);
    if(card.reps === GOAL) setTimeout(() => toast(`✅ „${card.pt}“ abgehakt – 50 Mal richtig!`), 50);
  } else if(result === "mid"){ card.due = Date.now() + 10*60000; }
  else { state.stats.wrong++; card.wrong = (card.wrong || 0) + 1; card.last = Date.now(); card.due = Date.now() + 60000; }
  touchDay(); scheduleSave(); renderHeader();
}
function submitAnswer(){
  if(!card || answered || (cardKind !== "type" && cardKind !== "fix")) return;
  const ans = $("#vAns").value;
  let r;
  if(cardKind === "fix"){ const a = normalize(ans), t = normalize(card.pt); r = !a ? "wrong" : a === t ? "ok" : stripAcc(a) === stripAcc(t) ? "accent" : "wrong"; }
  else r = checkAnswer(ans, cardDir === "de2pt" ? card.pt : card.de);
  answered = {ans, r};
  grade(r === "ok" ? "ok" : (r === "wrong" ? "bad" : "mid"));
  renderVocab();
}
function addWord(e, quiet){
  if(state.vocab.some(v => v.pt.toLowerCase() === e.pt.toLowerCase())) return false;
  state.vocab.push({pt:e.pt, de:e.de, theme:e.theme || null, box:0, due:0});
  scheduleSave(); renderHeader();
  if(!quiet) toast("Zum Trainer hinzugefügt – du lernst es als neues Wort.");
  return true;
}

/* KI-Wörterbuch */
async function lookup(word){
  const key = stripAcc(normalize(word)).slice(0, 80);
  if(state.dictCache[key]) return state.dictCache[key];
  if(!sample) throw {code:"no_sample"};
  const prompt = `Du bist ein sorgfältiges Wörterbuch für EUROPÄISCHES Portugiesisch (Portugal) für deutsche Lernende. Rechtschreibung nach dem Acordo Ortográfico 1990 in der portugiesischen Form.
Schlage nach: "${String(word).slice(0, 80)}" (das kann ein deutsches oder ein portugiesisches Wort bzw. eine kurze Wendung sein).
Antworte NUR mit einem JSON-Objekt, ohne weiteren Text:
{"pt":"Grundform auf Portugiesisch, Nomen mit bestimmtem Artikel","de":"deutsche Bedeutung(en)","wortart":"Nomen|Verb|Adjektiv|Adverb|Ausdruck|…","genus":"m|f|null","plural":"Pluralform oder null","aussprache":"deutsche Annäherung, Silben mit Bindestrich, betonte Silbe in GROSSBUCHSTABEN, so wie man es in Portugal spricht","beispiele":[{"pt":"…","de":"…"},{"pt":"…","de":"…"}],"konjugation":{"eu":"","tu":"","ele/ela/você":"","nós":"","vocês":"","eles/elas":""},"brasil":"Unterschied zu Brasilien oder null","hinweis":"kurzer Hinweis zu Gebrauch/Register oder null","eselsbruecke":"kurze deutsche Merkhilfe"}
Regeln: nur Formen, die in Portugal üblich sind. "konjugation" nur bei Verben (Presente do Indicativo), sonst null. Beispielsätze kurz, natürlich, etwa Niveau A2. Ist das gesuchte Wort brasilianisch oder in Portugal unüblich, gib das portugiesische Wort an und erkläre es unter "brasil". Bist du unsicher, schreibe das in "hinweis". Prüfe Akzente, Genus und Rechtschreibung doppelt.`;
  let val;
  try{
    if(typeof sample.json === "function") val = await sample.json(prompt, {modelTier:"complex"});
    else { const r = await sample(prompt, {modelTier:"complex"}); val = JSON.parse(((r && r.text) || "").match(/\{[\s\S]*\}/)[0]); }
    if(typeof val === "string") val = JSON.parse(val.match(/\{[\s\S]*\}/)[0]);
  }catch(e){ if(e && e.code) throw e; throw {code:"parse"}; }
  if(!val || typeof val.pt !== "string" || !val.pt.trim()) throw {code:"parse"};
  state.dictCache[key] = val;
  state.dictOrder = state.dictOrder.filter(k => k !== key).concat([key]);
  while(state.dictOrder.length > 40){ delete state.dictCache[state.dictOrder.shift()]; }
  scheduleSave();
  return val;
}
function lookupError(err){
  const c = err && err.code;
  if(c === "no_sample") return "Ausführliche Einträge gehen nur, wenn die App in Claude geöffnet ist.";
  if(c === "not_granted") return "Die KI wurde für diese App nicht freigegeben.";
  if(c === "rate_limited") return "Zu viele Anfragen – warte kurz und versuch es nochmal.";
  return "Nachschlagen hat nicht geklappt. Versuch es nochmal.";
}
function searchDict(q){
  const n = stripAcc(normalize(q)); if(!n) return [];
  const map = new Map();
  state.vocab.filter(e => e.kind !== "fix").concat(DICT).forEach(e => { const k = e.pt.toLowerCase(); if(!map.has(k)) map.set(k, {pt:e.pt, de:e.de, theme:e.theme}); });
  const res = [];
  map.forEach(e => {
    const p = stripAcc(normalize(e.pt)), d = stripAcc(normalize(e.de)), pa = noArt(p), da = noArt(d);
    const words = (p + " " + d + " " + d.replace(/\//g," ")).split(/\s+/);
    let s = -1;
    if(p === n || pa === n || d === n || da === n || variants(e.de).some(v => noArt(stripAcc(v)) === n)) s = 0;
    else if(pa.startsWith(n) || da.startsWith(n)) s = 1;
    else if(words.some(w => w.startsWith(n))) s = 2;
    else if(p.includes(n) || d.includes(n)) s = 3;
    if(s >= 0) res.push([s, e]);
  });
  return res.sort((a,b) => a[0] - b[0] || a[1].pt.length - b[1].pt.length).slice(0, 40).map(x => x[1]);
}

/* ---------- Wörter aus dem Gespräch sammeln ---------- */
let harvestQueue = Promise.resolve(), harvesting = 0;
const vkey = s => noArt(stripAcc(normalize(s)));
function vocabKeys(){
  const have = new Set();
  state.vocab.forEach(v => { if(v.kind === "fix") return; have.add(vkey(v.pt)); String(v.pt).split("/").forEach(p => have.add(vkey(p))); });
  return have;
}
function harvest(texts, quiet){
  if(!sample || settings().autoCollect === false) return Promise.resolve(0);
  harvesting++;
  const job = harvestQueue.then(() => doHarvest(texts, quiet)).catch(() => 0).finally(() => { harvesting--; });
  harvestQueue = job;
  return job;
}
async function doHarvest(texts, quiet){
  const src = texts.join("\n---\n").slice(0, 6000);
  if(!/[a-zà-ú]/i.test(src)) return 0;
  const prompt = `Du extrahierst Vokabeln für einen deutschen Lernenden des EUROPÄISCHEN Portugiesisch (Portugal, Rechtschreibung nach dem Acordo Ortográfico 1990 in der portugiesischen Form).
Hier ist ein Ausschnitt aus einem Gespräch zwischen Lehrer und Schüler. Es ist Deutsch und Portugiesisch gemischt:
"""
${src}
"""
Nachrichten des Schülers beginnen mit "Schüler:", die des Lehrers mit "Lehrer:".
Aufgabe 1: Liste JEDES portugiesische Wort und jede feste portugiesische Wendung, die darin vorkommt – vom Lehrer und vom Schüler.
Aufgabe 2: Übersetze außerdem JEDES deutsche Wort aus den Schüler-Nachrichten (nur Schüler, nicht die deutschen Erklärungen des Lehrers) ins europäische Portugiesisch und liste es ebenfalls (pt = portugiesische Grundform, de = das deutsche Wort in Grundform). Bei mehreren Bedeutungen nimm die, die im Zusammenhang gemeint ist.
Regeln:
- Grundform: Nomen mit bestimmtem Artikel im Singular (o/a), Verben im Infinitiv (reflexive mit -se, z. B. chamar-se), Adjektive männlich Singular. Typische feste Wendungen (z. B. "se faz favor", "tudo bem?", "até logo") zusätzlich als Ganzes.
- Falsch geschriebene Wörter des Schülers nur in der korrekten Form. Brasilianische Formen durch die in Portugal übliche Form ersetzen.
- Keine Eigennamen, keine Ziffern, keine Doppelungen. "pt" ist immer Portugiesisch.
- "de" = kurze, genaue deutsche Bedeutung (bei Verben mit "…en").
- Prüfe Akzente und Rechtschreibung genau.
Antworte NUR mit JSON: {"woerter":[{"pt":"…","de":"…"}]}`;
  let val;
  try{
    if(typeof sample.json === "function") val = await sample.json(prompt, {modelTier:"default"});
    else { const r = await sample(prompt, {modelTier:"default"}); val = JSON.parse(((r && r.text) || "").match(/\{[\s\S]*\}/)[0]); }
    if(typeof val === "string") val = JSON.parse(val.match(/\{[\s\S]*\}/)[0]);
  }catch(e){ return 0; }
  const arr = Array.isArray(val) ? val : (val && Array.isArray(val.woerter) ? val.woerter : []);
  const have = vocabKeys();
  let n = 0;
  arr.slice(0, 60).forEach(w => {
    if(!w || typeof w.pt !== "string" || typeof w.de !== "string") return;
    const pt = w.pt.trim().slice(0, 80), de = w.de.trim().slice(0, 100), k = vkey(pt);
    if(!k || !de || have.has(k) || /\d/.test(pt)) return;
    have.add(k);
    state.vocab.push({pt, de, theme:"chat", box:0, due:0, added:Date.now()}); n++;
  });
  if(n){
    scheduleSave(); renderHeader();
    const vv = $("#view-vocab");
    if(!(vv && vv.classList.contains("active") && vTab === "train")) renderVocab();
    if(!quiet) toast(`📥 +${n} ${n === 1 ? "neues Wort" : "neue Wörter"} aus dem Gespräch im Trainer`);
  }
  return n;
}
async function harvestHistory(btn){
  if(!sample){ if(!LANG.tutor) toast("Den KI-Lehrer gibt es vorerst nur für Portugiesisch."); else if(window.__acct) window.__acct.openTutor(); else toast("Das geht nur, wenn die App in Claude geöffnet ist."); return; }
  const msgs = state.chat.slice(-40);
  btn.disabled = true;
  let total = 0;
  for(let i = 0; i < msgs.length; i += 6){
    btn.textContent = `Durchsuche … ${Math.min(100, Math.round(i / msgs.length * 100))} %`;
    total += await harvest(msgs.slice(i, i + 6).filter(m => m.role !== "user" || m.typed !== false).map(m => (m.role === "user" ? "Schüler: " : "Lehrer: ") + m.content), true) || 0;
  }
  toast(total ? `📥 ${total} neue Wörter aus deinen bisherigen Gesprächen` : "Keine neuen Wörter gefunden – alles schon im Trainer.");
  renderVocab();
}

function renderDict(){
  const b = $("#vBody");
  b.innerHTML = `<p class="lead">Suche auf ${LANG.native} oder ${LANG.inLang}. Tippe auf ein Wort für Aussprache, Beispiele und Konjugation. Steht es nicht drin, schlägt der KI-Lehrer es nach.</p>
    <input id="dictInput" class="search" type="search" placeholder="z. B. Kühlschrank oder ${esc((DICT[2] || {}).pt || "")}" value="${esc(dictQuery)}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="dictOut"></div>`;
  const inp = $("#dictInput"); let t;
  inp.addEventListener("input", () => { dictQuery = inp.value; dictSel = null; dictState = null; clearTimeout(t); t = setTimeout(renderDictResults, 120); });

async function openEntry(word, base){

  catch(err){ if(dictSel && dictSel.word === word){ dictState = {error:lookupError(err)}; renderDictResults(); } }
}

function bindEntry(root){

  g("eBack").onclick = () => { dictSel = null; dictState = null; renderDictResults(); };
  if(g("eAdd")) g("eAdd").onclick = () => { const e = dictState.entry; addWord({pt:e.pt, de:e.de, theme:dictSel.base && dictSel.base.theme}); renderDictResults(); };
  if(g("eAddBase")) g("eAddBase").onclick = () => { addWord(dictSel.base); renderDictResults(); };

/* ---------- Hilfen ---------- */
const shuf = a => { const r = a.slice(); for(let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const pickN = (a, n) => shuf(a).slice(0, n);
const uniqBy = (a, f) => { const s = new Set(); return a.filter(x => { const k = f(x); if(s.has(k)) return false; s.add(k); return true; }); };
const wordsUpTo = n => UNITS.filter(u => u.num <= n).flatMap(u => u.W);
const sentsUpTo = n => UNITS.filter(u => u.num <= n).flatMap(u => u.S);
const cleanW = w => w.replace(/[.,!?;:¿¡"«»„“]/g, "");
const FUNC = P.FUNC || ["o","a","os","as","um","uma","de","do","da","em","no","na","ao","à","às","com","para","por","que","e","se","não","me","te"];
function mcOptions(right, field, pool, n){
  const opts = uniqBy(shuf(pool.filter(x => x[field] !== right[field] && x.pt !== right.pt)), x => x[field]).slice(0, (n || 4) - 1).map(x => x[field]);
  let guard = 0;
  while(opts.length < (n || 4) - 1 && guard++ < 60){ const d = randOf(DICT)[field]; if(d !== right[field] && !opts.includes(d)) opts.push(d); }
  return shuf(opts.concat([right[field]]));
}

/* ---------- Aufgaben bauen ---------- */
function itMC(w, pool, dir){ return {type:"mc", w, dir, opts:mcOptions(w, dir === "pt2de" ? "de" : "pt", pool)}; }
function itWrite(w){ return {type:"write", w}; }
function itBuild(s, listen){
  const toks = s.pt.split(" ");
  const extra = pickN(sentsUpTo(s.u + 1).filter(x => x.pt !== s.pt).flatMap(x => x.pt.split(" ")).filter(t => !toks.map(cleanW).map(x => x.toLowerCase()).includes(cleanW(t).toLowerCase())), Math.min(3, Math.max(1, 8 - toks.length)));
  return {type:"build", s, listen:!!listen, bank:shuf(toks.concat(extra).map((w, i) => ({w, i})))};
}
function itBankDE(s){
  const toks = s.de.replace(/[.,!?;:]/g, "").split(" ");
  const pool = sentsUpTo(s.u + 2).filter(x => x.de !== s.de).flatMap(x => x.de.replace(/[.,!?;:]/g, "").split(" ")).filter(t => !toks.map(x => x.toLowerCase()).includes(t.toLowerCase()));
  return {type:"bankde", s, bank:shuf(toks.concat(pickN(uniqBy(pool, x => x.toLowerCase()), 3)).map((w, i) => ({w, i})))};
}
function itTypePT(s){ return {type:"typept", s}; }
function itCloze(s){
  const toks = s.pt.split(" ");
  let cand = toks.map((t, i) => ({t, i, c:cleanW(t)})).filter(x => x.c.length >= 2 && !/^[A-Z]/.test(x.c));
  if(!cand.length) cand = toks.map((t, i) => ({t, i, c:cleanW(t)})).filter(x => x.c.length >= 1);
  const pref = cand.filter(x => FUNC.includes(x.c.toLowerCase()) || x.c.length >= 4);
  const b = randOf(pref.length ? pref : cand);
  const isF = FUNC.includes(b.c.toLowerCase());
  let pool = isF ? FUNC.slice() : sentsUpTo(s.u + 1).flatMap(x => x.pt.split(" ").map(cleanW)).filter(x => x.length >= 3 && !/^[A-Z]/.test(x));
  pool = uniqBy(pool.filter(x => x.toLowerCase() !== b.c.toLowerCase() && !toks.map(t => cleanW(t).toLowerCase()).includes(x.toLowerCase())), x => x.toLowerCase());
  return {type:"cloze", s, idx:b.i, answer:b.c, opts:shuf(pickN(pool, 3).concat([b.c]))};
}
function itListen(s){ const pool = sentsUpTo(Math.max(s.u, 3)).filter(x => x.de !== s.de); return {type:"listen", s, opts:shuf(pickN(pool, 3).map(x => x.de).concat([s.de]))}; }
function itListenType(w){ return {type:"listentype", w}; }
function itSpeak(s){ return {type:"speak", s}; }
function itDialog(d){ return {type:"dialog", d, opts:shuf([d.ok].concat(d.wrong))}; }

function buildSession(kind, U, opt){
  opt = opt || {};
  const n = U ? U.num : Math.max(1, currentUnit().num);
  const poolW = wordsUpTo(n), items = [];
  if(kind === "lesson"){
    const half = Math.ceil(U.W.length / 2), ws = opt.k ? U.W.slice(half) : U.W.slice(0, half);
    const sh = Math.ceil(U.S.length / 2), ss = opt.k ? U.S.slice(sh) : U.S.slice(0, sh);
    const ps = pathState(); if(!ps.seen) ps.seen = {};
    const seen = w => !!ps.seen[w.pt.toLowerCase()];
    const intro = [], rest = [];
    ws.forEach(w => { if(!seen(w)) intro.push({type:"intro", w}, itMC(w, U.W.concat(poolW), "pt2de")); else rest.push(itMC(w, U.W.concat(poolW), "pt2de")); });
    pickN(ws, 2).forEach(w => rest.push(itMC(w, U.W.concat(poolW), "de2pt")));
    pickN(ws, 2).forEach(w => rest.push(itWrite(w)));
    ss.forEach((s, i) => rest.push([itBuild, itBankDE, itCloze, itListen][i % 4](s)));
    const dl = DLG.filter(d => d.u <= n && d.u >= n - 3); if(dl.length) rest.push(itDialog(randOf(dl)));
    return intro.concat(shuf(rest)).slice(0, 15);
  }
  if(kind === "listen"){
    const ss = U ? U.S : sentsUpTo(n);
    pickN(ss, 4).forEach(s => items.push(itListen(s)));
    pickN(U ? U.W : poolW, 3).forEach(w => items.push(itListenType(w)));
    pickN(ss, 2).forEach(s => items.push(itBuild(s, true)));
    return shuf(items);
  }
  if(kind === "speak"){
    const ss = U ? U.S : sentsUpTo(n);
    pickN(ss, 5).forEach(s => items.push(itSpeak(s)));
    pickN(ss, 2).forEach(s => items.push(itListen(s)));
    return items;
  }
  if(kind === "story"){
    items.push({type:"story", st:U.ST});
    U.ST.qs.forEach(q => items.push({type:"storyq", q, opts:shuf([q.ok].concat(q.wrong))}));
    return items;
  }
  if(kind === "review" || kind === "test"){
    const ws = U ? U.W.concat(pickN(poolW, 4)) : poolW, ss = U ? U.S.concat(pickN(sentsUpTo(n), 3)) : sentsUpTo(n);
    const hard = state.vocab.filter(v => (v.wrong || 0) > (v.right || 0) / 3 && v.wrong).map(v => ({pt:v.pt, de:v.de, u:n}));
    const wpool = uniqBy(hard.concat(ws), x => x.pt);
    const cnt = kind === "test" ? 12 : 10;
    const mk = [w => itMC(w, wpool, "de2pt"), w => itWrite(w), w => itMC(w, wpool, "pt2de"), w => itListenType(w)];
    pickN(wpool, Math.ceil(cnt / 2)).forEach((w, i) => items.push(mk[(i + (kind === "test" ? 1 : 0)) % mk.length](w)));
    const ms = kind === "test" ? [itTypePT, itBuild, itCloze, itBankDE, itListen] : [itBuild, itCloze, itListen, itBankDE];
    pickN(ss, Math.floor(cnt / 2)).forEach((s, i) => items.push(ms[i % ms.length](s.pt.split(" ").length > 7 && ms[i % ms.length] === itTypePT ? s : s)));
    return shuf(items).slice(0, cnt);
  }
  if(kind === "mistakes"){
    const log = (state.mistakeLog || []).slice(-30).reverse();
    uniqBy(log, m => m.key).slice(0, 10).forEach(m => { const it = rebuildItem(m); if(it) items.push(it); });
    return items;
  }
  if(kind === "hard"){
    const hard = state.vocab.filter(v => v.kind !== "fix" && (v.wrong || 0) > 0).sort((a, b) => (b.wrong || 0) - (a.wrong || 0)).slice(0, 10).map(v => ({pt:v.pt, de:v.de, u:n}));
    hard.forEach((w, i) => items.push(i % 2 ? itWrite(w) : itMC(w, hard.concat(poolW), "de2pt")));
    return items;
  }
  if(kind === "grammar"){
    const weak = weakTopics().map(t => t.topic);
    let ss = sentsUpTo(n).filter(s => s.topic && (weak.length ? weak.includes(s.topic) : true));
    if(ss.length < 4) ss = sentsUpTo(n);
    pickN(ss, 8).forEach((s, i) => items.push([itCloze, itBuild, itTypePT][i % 3](s)));
    return items;
  }
  if(kind === "dialogs"){
    const dl = DLG.filter(d => d.u <= Math.max(n, 2));
    pickN(dl, 6).forEach(d => items.push(itDialog(d)));
    const st = UNITS.filter(u => u.ST && u.num <= Math.max(n, 2));
    if(st.length){ const S = randOf(st).ST; items.unshift({type:"story", st:S}); S.qs.forEach(q => items.splice(1, 0, {type:"storyq", q, opts:shuf([q.ok].concat(q.wrong))})); }
    return items;
  }
  return items;
}
function rebuildItem(m){
  const w = m.w, s = m.s;
  switch(m.type){
    case "mc": return itMC(w, wordsUpTo(Math.max(w.u || 1, 3)), m.dir || "pt2de");
    case "write": case "intro": return itWrite(w);
    case "listentype": return itListenType(w);
    case "build": return itBuild(s);
    case "bankde": return itBankDE(s);
    case "typept": return itTypePT(s);
    case "cloze": return itCloze(s);
    case "listen": return itListen(s);
    case "speak": return itSpeak(s);
    case "dialog": return m.d ? itDialog(m.d) : null;
  }
  return null;
}

/* ---------- Herzen, XP, Tagesdaten ---------- */
const HEART_MS = 30 * 60000, MAX_HEARTS = 5;
function regenHearts(){
  if(state.hearts == null) state.hearts = MAX_HEARTS;
  if(state.hearts >= MAX_HEARTS){ state.heartsTs = Date.now(); return; }
  const n = Math.floor((Date.now() - (state.heartsTs || Date.now())) / HEART_MS);
  if(n > 0){ state.hearts = Math.min(MAX_HEARTS, state.hearts + n); state.heartsTs = (state.heartsTs || Date.now()) + n * HEART_MS; }
}
function daily(){
  const t = dayKey(Date.now());
  if(!state.daily || state.daily.day !== t) state.daily = {day:t, lessons:0, newWords:0, listen:0, seconds:0, claimed:{}};
  return state.daily;
}
function addXP(n){ state.xp = (state.xp || 0) + n; if(!state.xpDays) state.xpDays = {}; const t = dayKey(Date.now()); state.xpDays[t] = (state.xpDays[t] || 0) + n; }
const todayXP = () => (state.xpDays || {})[dayKey(Date.now())] || 0;
function goalXP(){ return settings().goal || 20; }
const QUESTS = [

  {id:"words100", e:"📚", t:"100 Wörter", d:"100 Wörter gelernt", ok:() => state.vocab.filter(v => v.box >= 1 && v.kind !== "fix").length >= 100},
  {id:"streak7", e:"🔥", t:"7 Tage am Stück", d:"7 Tage hintereinander gelernt", ok:() => (state.stats.streak || 0) >= 7},

  {id:"streak30", e:"🌟", t:"30 Tage am Stück", d:"Einen Monat lang jeden Tag", ok:() => (state.stats.streak || 0) >= 30}
];
function checkRewards(){
  const out = [];
  if(!state.ach) state.ach = {};
  ACHIEVEMENTS.forEach(a => { if(!state.ach[a.id] && a.ok()){ state.ach[a.id] = Date.now(); out.push({kind:"ach", ...a}); } });
  const d = daily();
  QUESTS.forEach(q => { if(!d.claimed[q.id] && q.get(d) >= q.goal){ d.claimed[q.id] = true; addXP(10); out.push({kind:"quest", e:q.e, t:q.t}); } });
  return out;
}
function noteTopic(topic, ok){ if(!topic) return; if(!state.topics) state.topics = {}; const t = state.topics[topic] || (state.topics[topic] = {r:0, w:0}); ok ? t.r++ : t.w++; }
function weakTopics(){ return Object.entries(state.topics || {}).map(([topic, v]) => ({topic, ...v, rate:v.w / Math.max(1, v.r + v.w)})).filter(x => x.r + x.w >= 2 && x.w > 0).sort((a, b) => b.rate - a.rate).slice(0, 4); }
function noteWord(w, ok, isNew){
  let v = state.vocab.find(x => x.pt.toLowerCase() === w.pt.toLowerCase());
  if(!v){ v = {pt:w.pt, de:w.de, theme:"path", box:1, due:Date.now() + 60000, reps:0}; state.vocab.push(v); if(isNew) daily().newWords++; }
  else if(!v.box){ v.box = 1; v.due = Date.now() + 60000; if(isNew) daily().newWords++; }
  if(ok === true){ v.right = (v.right || 0) + 1; v.reps = (v.reps || 0) + 1; v.due = Date.now() + repInterval(v.reps) / Math.max(1, (v.wrong || 0) - (v.right || 0) / 3 + 1); }
  else if(ok === false){ v.wrong = (v.wrong || 0) + 1; v.due = Date.now() + 60000; }
  v.last = Date.now();
}
function logMistake(it){
  if(!state.mistakeLog) state.mistakeLog = [];
  const key = it.type + ":" + (it.w ? it.w.pt : it.s ? it.s.pt : it.d ? it.d.a : "");
  state.mistakeLog.push({key, type:it.type, dir:it.dir, w:it.w ? {pt:it.w.pt, de:it.w.de, u:it.w.u} : null, s:it.s ? {pt:it.s.pt, de:it.s.de, topic:it.s.topic, note:it.s.note, u:it.s.u} : null, d:it.d || null, at:Date.now()});
  state.mistakeLog = state.mistakeLog.slice(-60);
}
function clearMistake(it){
  if(!state.mistakeLog) return;
  const key = it.type + ":" + (it.w ? it.w.pt : it.s ? it.s.pt : it.d ? it.d.a : "");
  state.mistakeLog = state.mistakeLog.filter(m => m.key !== key);
}

/* ---------- Soundeffekte ---------- */
let actx = null;
function sfx(kind){
  if(settings().sfx === false) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === "ok" ? [660, 880] : kind === "bad" ? [220, 180] : [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * (kind === "done" ? .11 : .09);
      o.type = kind === "bad" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.18, t0 + .02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + .22);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + .25);
    });
  }catch(e){}
}
function confetti(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const W = c.width = innerWidth, H = c.height = innerHeight, x = c.getContext("2d");
  const cols = ["#2F6BFF","#16A974","#FF6B4A","#FFB800","#8B5CF6","#0EA5A4"];
  const P = Array.from({length:110}, () => ({x:W / 2 + (Math.random() - .5) * 80, y:H * .35, vx:(Math.random() - .5) * 12, vy:-Math.random() * 12 - 4, r:Math.random() * 6 + 4, c:randOf(cols), a:Math.random() * 6, va:(Math.random() - .5) * .4}));
  let t = 0;
  (function f(){ x.clearRect(0, 0, W, H); P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }); if(++t < 110) requestAnimationFrame(f); else c.remove(); })();
}

/* ---------- Prüfen & Feedback ---------- */
function evaluate(it){
  const typed = SES.typed || "";
  const sentOK = (ans, target) => { const a = normalize(ans), t = normalize(target); if(!a) return "bad"; if(a === t) return "ok"; if(stripAcc(a) === stripAcc(t)) return "mid"; return "bad"; };
  switch(it.type){
    case "mc": return SES.sel === (it.dir === "pt2de" ? it.w.de : it.w.pt) ? "ok" : "bad";
    case "write": case "listentype": { const r = checkAnswer(typed, it.w.pt); return r === "ok" ? "ok" : r === "wrong" ? "bad" : "mid"; }
    case "build": return sentOK(SES.picked.map(k => it.bank[k].w).join(" "), it.s.pt);
    case "bankde": return sentOK(SES.picked.map(k => it.bank[k].w).join(" "), it.s.de);
    case "typept": return sentOK(typed, it.s.pt);
    case "cloze": return SES.sel && SES.sel.toLowerCase() === it.answer.toLowerCase() ? "ok" : "bad";
    case "listen": return SES.sel === it.s.de ? "ok" : "bad";
    case "dialog": return SES.sel === it.d.ok ? "ok" : "bad";
    case "storyq": return SES.sel === it.q.ok ? "ok" : "bad";
    case "speak": {
      if(SES.sel === "ok") return "ok"; if(SES.sel === "no") return "bad";
      const tgt = normalize(it.s.pt).split(" ").map(stripAcc), got = normalize(SES.sel || "").split(" ").map(stripAcc);
      const hit = tgt.filter(w => { const i = got.indexOf(w); if(i >= 0){ got.splice(i, 1); return true; } return false; }).length;
      SES.speakScore = hit / Math.max(1, tgt.length);
      return SES.speakScore >= 0.7 ? "ok" : SES.speakScore >= 0.45 ? "mid" : "bad";
    }
  }
  return "bad";
}
function solutionOf(it){
  switch(it.type){
    case "mc": return it.dir === "pt2de" ? it.w.de : it.w.pt;
    case "write": case "listentype": return it.w.pt;
    case "build": case "typept": case "cloze": case "speak": return it.s.pt;
    case "bankde": case "listen": return it.s.de;
    case "dialog": return it.d.ok;
    case "storyq": return it.q.ok;
  }
  return "";
}
function explainOf(it){
  if(it.w) return `„${it.w.pt}“ bedeutet „${it.w.de}“.`;
  if(it.s){ let x = it.type === "bankde" || it.type === "listen" ? `„${it.s.pt}“ heißt: „${it.s.de}“.` : `Auf ${LANG.native}: „${it.s.de}“.`; if(it.type === "cloze") x = `In die Lücke gehört „${it.answer}“. ` + x; return x + (it.s.note ? " " + it.s.note : ""); }
  if(it.d) return `„${it.d.a}“ heißt „${it.d.ade}“. Passend ist: „${it.d.ok}“.`;
  return "";
}
function doCheck(){
  const it = SES.cur; if(SES.answered) return;
  SES.answered = true;
  let r = evaluate(it);
  const first = !SES.retry.has(SES.i + ":" + it.type) && !it._retry;
  if(r === "ok" || r === "mid"){
    if(first) SES.ok++;
    sfx("ok"); if(SES.kind === "mistakes") clearMistake(it);
  } else {
    if(first) SES.bad++;

  if(["listen","listentype"].includes(it.type) || (it.type === "build" && it.listen)){ daily().listen++; state.stats.listenTotal = (state.stats.listenTotal || 0) + 1; }

function finishSession(){

const NODE_X = [0, 52, 78, 52, 0, -52, -78, -52];
let learnScrolled = false;
function renderLearn(){
  const v = $("#view-learn"); if(!v) return;
  const cur = currentStationIdx();
  const hour = new Date().getHours(), doneToday = state.stats.lastDay === dayKey(Date.now());
  let html = "";
  if(!doneToday && (state.stats.streak || 0) > 0 && hour >= 17) html += `<div class="warn-banner">${ICON.flame}<div><b>Deine Serie ist in Gefahr!</b><span>Mach heute noch eine Lektion, um deine ${state.stats.streak}-Tage-Serie zu halten.</span></div></div>`;
  html += `<div class="goal-strip"><div class="gs-txt"><b>Tagesziel</b><span>${Math.min(todayXP(), goalXP())} / ${goalXP()} XP</span></div><div class="gs-bar"><i style="width:${Math.min(100, todayXP() / goalXP() * 100)}%"></i></div></div>`;
  let gi = 0;
  PATH_SECTIONS.forEach((S, si) => {
    const sUnits = S.units, sDone = sUnits.filter(unitDone).length;
    const firstIdx = ALL_STATIONS.findIndex(x => x.U === sUnits[0]);
    const locked = firstIdx > cur;
    html += `<section class="sec ${locked ? "locked" : ""}" style="--c:${S.color}">
      <div class="sec-head"><div><small>Abschnitt ${si + 1} · ${S.level}</small><h2>${esc(S.title)}</h2><p>${esc(S.pt)}</p></div><div class="sec-prog">${sDone}/${sUnits.length}</div></div>`;
    sUnits.forEach(U => {
      const sts = unitStations(U), nDone = sts.filter(s => stDone(s.id)).length;
      html += `<div class="unit" style="--c:${U.color}" id="unit-${U.id}">
        <div class="unit-head"><span class="unit-e">${U.e}</span><div class="unit-t"><small>Einheit ${U.num}</small><b>${esc(U.title)}</b><span>${esc(U.pt)} · ${esc(U.desc)}</span></div>
          <div class="unit-ring" style="--p:${nDone / sts.length * 100}"><span>${nDone}/${sts.length}</span></div></div>
        <div class="nodes">`;
      sts.forEach((s, k) => {
        const idx = gi++, done = stDone(s.id), isCur = idx === cur, lockedN = idx > cur;
        const info = ST_INFO[s.t];
        const cls = done ? "done" : isCur ? "cur" : "lock";
        html += `<div class="node-wrap" style="transform:translateX(${NODE_X[k % NODE_X.length]}px)">
          ${isCur ? `<div class="node-bubble">${s.t === "chest" ? "Öffnen!" : "Start"}</div>` : ""}
          <button class="node ${cls} n-${s.t}" data-st="${idx}" aria-label="${info.label}${done ? " (erledigt)" : lockedN ? " (gesperrt)" : ""}">
            <svg viewBox="0 0 24 24" aria-hidden="true">${lockedN && s.t !== "chest" ? ICON.lock.replace(/<\/?svg[^>]*>/g, "") : info.icon}</svg>
            ${done && s.t !== "chest" ? `<span class="node-check">${ICON.done}</span>` : ""}
          </button></div>`;
      });
      html += `</div></div>`;
    });
    html += `</section>`;
  });
  html += `<div class="path-end">🏁 Weitere Einheiten folgen – frag deinen Lehrer jederzeit nach neuen Themen!</div>`;
  v.innerHTML = html;
  v.querySelectorAll("[data-st]").forEach(b => b.onclick = () => openStationSheet(+b.dataset.st));
  if(!learnScrolled){
    learnScrolled = true;
    requestAnimationFrame(() => { const c = v.querySelector(".node.cur"); if(c){ const y = c.getBoundingClientRect().top - v.getBoundingClientRect().top + v.scrollTop - v.clientHeight / 2.4; v.scrollTop = y < 260 ? 0 : y; } });
  }
}
function openStationSheet(idx){
  const st = ALL_STATIONS[idx], cur = currentStationIdx(), U = st.U, info = ST_INFO[st.t];
  const done = stDone(st.id), locked = idx > cur;
  const sh = ensureSheet();
  const desc = {lesson:"Neue Wörter und Sätze mit verschiedenen Übungen.", listen:"Hör genau hin: Sätze verstehen und Wörter aufschreiben.", speak:"Sprich Sätze nach und übe deine Aussprache.", story:"Eine kurze Geschichte mit Fragen dazu.", review:"Wiederhole alles aus dieser und früheren Einheiten.", test:"Zeig, was du kannst: Ab 80 % ist die Einheit geschafft.", chest:"Deine Belohnung für die abgeschlossene Einheit."}[st.t];
  sh.querySelector(".sh-in").style.setProperty("--c", U.color);
  sh.querySelector(".sh-in").innerHTML = `<div class="sh-grab"></div>
    <div class="sh-top"><span class="sh-ic">${U.e}</span><div><small>Einheit ${U.num} · ${esc(U.title)}</small><h3>${info.label}${st.t === "lesson" ? " " + (st.k + 1) : ""}</h3></div></div>

    <div class="sh-meta"><span>${ICON.bolt} +${info.xp} XP</span>${st.t !== "chest" ? `<span>⏱️ ca. ${st.t === "test" ? 6 : st.t === "story" ? 3 : 4} Min.</span>` : ""}${done ? `<span class="ok">✓ erledigt</span>` : ""}</div>
    ${locked ? `<button class="btn3d gray" disabled>${ICON.lock} Erst die vorherigen Stationen abschließen</button>` :
      st.t === "chest" ? (done ? `<button class="btn3d gray" disabled>Schon geöffnet</button>` : `<button class="btn3d gold" id="shGo">Truhe öffnen</button>`) :
      `<button class="btn3d" id="shGo" style="--b:${U.color}">${done ? "Nochmal üben" : "Los geht's"}</button>`}`;
  sh.classList.remove("hidden");
  const go = sh.querySelector("#shGo");
  if(go) go.onclick = () => { sh.classList.add("hidden"); if(st.t === "chest") claimChest(st); else startSession(st.t, U, {k:st.k, station:st}); };
}
function ensureSheet(){

}

  if(window.__acct) window.__acct.renderProfileExtras(v);
  v.querySelectorAll("[data-goal]").forEach(b => b.onclick = () => { settings().goal = +b.dataset.goal; scheduleSave(); renderProfile(); });
  v.querySelectorAll("[data-npd2]").forEach(b => b.onclick = () => { settings().newPerDay = +b.dataset.npd2; scheduleSave(); renderProfile(); renderHeader(); });
  v.querySelectorAll("[data-mode2]").forEach(b => b.onclick = () => { vMode = b.dataset.mode2; card = null; renderProfile(); });
  v.querySelector("#swSfx").onclick = () => { settings().sfx = settings().sfx === false; scheduleSave(); renderProfile(); };
  v.querySelector("#swAuto").onclick = () => { settings().autoCollect = settings().autoCollect === false; scheduleSave(); renderProfile(); };
  v.querySelector("#pfPlan").onclick = () => { if(busy) return; openSub("chat", "profile"); send("Zeig mir bitte kurz meinen persönlichen Lernplan: wo ich stehe, was als Nächstes kommt und worauf ich besonders achten sollte."); };
  v.querySelector("#pfReset").onclick = () => confirmBox("Fortschritt zurücksetzen?", "Lernpfad, XP, Serie, Vokabeln, Chatverlauf und Notizen werden gelöscht. Das lässt sich nicht rückgängig machen.", "Zurücksetzen", () => {
    state = defaultState(); state.fixSeeded = true; state.mistakes = []; state.strengths = []; state.weaknesses = []; state.notes = "Neustart.";
    state.chat = LANG.code === "pt" ? [{role:"assistant", content:"Olá! Wir fangen neu an 🇵🇹 Möchtest du einen kurzen Einstufungstest machen? Dann stelle ich dir eine Frage nach der anderen."}] : INITIAL_CHAT.map(x => ({...x}));
    card = null; learnScrolled = false; scheduleSave(); renderAll(); switchView("learn");
  });
}


/* ---------- Sprachauswahl ---------- */
function langStoreKey(code){ return code === "pt" ? "ptlehrer.state.v1" : "lel.state." + code; }
function langLocalInfo(code){
  try{
    const x = JSON.parse(localStorage.getItem(langStoreKey(code)) || "null");
    if(!x) return null;
    return {xp:x.xp || 0, st:Object.keys((x.path && x.path.done) || {}).length};
  }catch(e){ return null; }
}
function renderLang(){
  const fl = document.getElementById("tabFlag"); if(fl) fl.textContent = LANG.flag;
  const v = $("#view-lang"); if(!v) return;
  const langs = window.LEL_LANGS || [];
  v.innerHTML = `<h2 class="pg-title">Sprache</h2>
    <p class="lead lang-lead">Wähle, welche Sprache du lernst. Jede Sprache hat ihren eigenen Lernpfad und ihren eigenen Fortschritt.</p>
    <div class="langs">${langs.map(L => {
      const ready = L.code === "pt" || !!(window.LEL_PACKS || {})[L.code];
      const on = L.code === LANG.code;
      const pack = (window.LEL_PACKS || {})[L.code];
      const info = on ? {xp:state.xp || 0, st:Object.keys(pathState().done).length} : langLocalInfo(L.code);
      const status = !ready ? "In Vorbereitung"
        : on ? `Lernst du gerade · ${info.xp} XP`
        : info && (info.xp || info.st) ? `${info.xp} XP auf diesem Gerät`
        : (L.code === "pt" ? "Vollständiger Kurs A1–C1" : (pack && pack.LANG && pack.LANG.status) || "Bereit");
      return `<button class="lang-row${on ? " on" : ""}" data-lang="${L.code}" ${ready ? "" : "disabled"} aria-pressed="${on}">
        <span class="lf" aria-hidden="true">${L.flag}</span>
        <span class="lt"><b>${esc(L.name)}</b><small>${esc(L.sub)}</small><small class="ls">${esc(status)}</small></span>
        ${on ? `<span class="ck" aria-hidden="true">✓</span>` : ""}</button>`;
    }).join("")}</div>
    <p class="hint lang-hint">Portugiesisch ist komplett. Die anderen Sprachen starten mit dem ersten A1-Abschnitt und wachsen Schritt für Schritt. Beim Deutschkurs wählst du die Sprache der Übersetzungen selbst.</p>`;
  v.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => b.dataset.lang === "de" ? chooseHelp(LANG.code === "de") : switchLang(b.dataset.lang));
  if(LANG.code === "de" && P.HELP_CUR){
    const h = document.createElement("button"); h.className = "lang-row"; h.style.marginTop = "10px"; h.id = "helpRow";
    h.innerHTML = `<span class="lf" aria-hidden="true">${P.HELP_CUR.flag}</span><span class="lt"><b>Hilfssprache: ${esc(P.HELP_CUR.own)}</b><small>Übersetzungen im Deutschkurs · tippen zum Ändern</small></span>`;
    v.querySelector(".langs").appendChild(h); h.onclick = () => chooseHelp(true);
  }
}
function chooseHelp(stay){
  const list = (window.LEL_PACKS.de && window.LEL_PACKS.de.HELP) || [];
  let cur = "en"; try{ cur = localStorage.getItem("lel.help") || "en"; }catch(e){}
  const o = document.createElement("div"); o.className = "help-ov";
  o.innerHTML = `<div class="help-box" role="dialog" aria-label="Hilfssprache"><h3>Deutsch lernen mit …</h3><p>Choose the language for translations · Çeviri dilini seç · Wybierz język tłumaczeń</p>
    ${list.map(h => `<button class="lang-row${h.code === cur ? " on" : ""}" data-help="${h.code}"><span class="lf">${h.flag}</span><span class="lt"><b>${esc(h.own)}</b><small>${esc(h.de)}</small></span></button>`).join("")}
    <button class="btn ghost" data-help-x style="width:100%;margin-top:8px">Abbrechen</button></div>`;
  document.body.appendChild(o);
  o.querySelector("[data-help-x]").onclick = () => o.remove();
  o.querySelectorAll("[data-help]").forEach(b => b.onclick = async () => {
    try{ localStorage.setItem("lel.help", b.dataset.help); }catch(e){}
    o.remove();
    if(stay){ try{ clearTimeout(saveTimer); dirty = true; await flush(); }catch(e){} location.reload(); }
    else switchLang("de");
  });
}
async function switchLang(code){
  if(code === LANG.code) return;
  const target = (window.LEL_LANGS || []).find(L => L.code === code);
  if(!target || (code !== "pt" && !(window.LEL_PACKS || {})[code])) return;
  toast("Wechsle zu " + target.name + " …");
  try{ clearTimeout(saveTimer); dirty = true; await flush(); }catch(e){}
  try{ localStorage.setItem("lel.lang", code); localStorage.setItem("ptlehrer.view", "learn"); }catch(e){}
  location.reload();
}

/* ---------- Navigation ---------- */
const TABS = ["learn", "review", "speak2", "awards", "lang", "profile"];
let subParent = "learn";
function openSub(name, parent){ subParent = parent || subParent; switchView(name); }
function renderAllTabs(){ renderHeader(); renderLearn(); renderReview(); renderSpeakHub(); renderAwards(); renderLang(); renderProfile(); }

/* ---------- navigation ---------- */
function backbar(t){ return `<div class="backbar"><button class="back" data-back aria-label="Zurück">‹</button><b>${t}</b></div>`; }
function switchView(name){
  if(name === "home") name = "learn";
  if(name === "progress") name = "profile";
  const isTab = TABS.includes(name);
  if(isTab) subParent = name;
  document.querySelectorAll(".view").forEach(sct => sct.classList.toggle("active", sct.id === "view-" + name));
  const activeTab = isTab ? name : subParent;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === activeTab));
  try{ localStorage.setItem("ptlehrer.view", name); }catch(e){}
  const v = document.getElementById("view-" + name);
  if(name === "chat"){ scrollChat(); return; }
  if(name === "learn") renderLearn();
  else if(name === "review") renderReview();
  else if(name === "speak2") renderSpeakHub();
  else if(name === "awards") renderAwards();
  else if(name === "profile") renderProfile();
  else if(name === "lang") renderLang();
  else if(name === "vocab"){ $("#view-vocab").innerHTML = ""; renderVocab(); }
  else if(name === "lessons") renderLessons();
  else if(name === "speak") renderSpeak();
  if(v && name !== "learn") v.scrollTop = 0;
  renderHeader();
}
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("[data-back]"); if(b){ e.preventDefault(); switchView(subParent); } });
function renderAll(){ regenHearts(); renderAllTabs(); renderHome(); renderHeader(); renderChat(); renderChips(); renderLessons(); renderSpeak(); renderVocab(); renderProgress(); }

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => switchView(b.dataset.view));
$("#composer").addEventListener("submit", e => { e.preventDefault(); const i = $("#input"); const t = i.value; if(!t.trim() || busy) return; if(listening && dict) dict.stop().catch(() => {}); i.value = ""; autosize(); send(t, true); });
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)){ e.preventDefault(); $("#composer").requestSubmit(); } });

renderAll();
window.__pt = {get SES(){ return SES; }, solutionOf, get state(){ return state; }, startSession, UNITS, ALL_STATIONS};
switchView("learn");
initCaps().then(() => { renderAllTabs(); });
setInterval(() => { if(!SES){ const h = state.hearts; regenHearts(); if(h !== state.hearts){ renderHeader(); scheduleSave(); } } }, 60000);
})();
</script>
