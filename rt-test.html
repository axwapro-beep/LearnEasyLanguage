<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEL Realtime-Test</title>
<style>body{font:16px -apple-system,system-ui,sans-serif;padding:20px;max-width:560px;margin:auto}b{font-size:20px}#log{white-space:pre-wrap;background:#f3f4f6;border-radius:12px;padding:12px;font:13px ui-monospace,monospace}</style></head>
<body><h1>Realtime-Test</h1><p>Status: <b id="st">verbinde …</b></p><p>Andere Testseiten online: <b id="n">0</b></p><p>Empfangene Nachrichten: <b id="rx">0</b></p><div id="log"></div>
<script>
const SB = (() => { let o = null; try{ o = JSON.parse(localStorage.getItem("lel.rt") || "null"); }catch(e){} return o || {url:"https://gaaipluxjcrkrsalylkt.supabase.co", key:"sb_publishable_9phab8JZAfkUaPIfOH45OQ_hpPLiBOy"}; })();

/* Minimaler Realtime-Client (Phoenix-Protokoll): Broadcast + Presence */
const RT = (() => {
  let ws = null, ref = 0, open = false, queue = [], hb = null;
  const chans = {};
  const wsUrl = () => SB.url.replace(/^http/, "ws").replace(/\/+$/, "") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(SB.key) + "&vsn=1.0.0";
  function send(m){ m.ref = String(++ref); const s = JSON.stringify(m); if(open && ws && ws.readyState === 1) ws.send(s); else queue.push(s); return m.ref; }
  function connect(){
    if(ws && ws.readyState < 2) return;
    try{ ws = new WebSocket(wsUrl()); }catch(e){ Object.values(chans).forEach(c => c.h.error && c.h.error(e)); return; }
    ws.onopen = () => {
      open = true;
      Object.values(chans).forEach(c => { if(!c.joined) c._join(); });
      queue.splice(0).forEach(s => ws.send(s));
      clearInterval(hb); hb = setInterval(() => send({topic:"phoenix", event:"heartbeat", payload:{}}), 25000);
    };
    ws.onmessage = e => { let m; try{ m = JSON.parse(e.data); }catch(x){ return; } const c = chans[m.topic]; if(c) c._msg(m); };
    ws.onclose = () => {
      open = false; clearInterval(hb);
      Object.values(chans).forEach(c => { c.joined = false; c.h.error && c.h.error({closed:true}); });
      if(Object.keys(chans).length) setTimeout(connect, 2500);
    };
    ws.onerror = () => {};
  }
  function channel(name, opts){
    const topic = "realtime:" + name;
    const c = {
      topic, joined:false, h:{}, presence:{}, meta:null,
      on(ev, fn){ this.h[ev] = fn; return this; },
      _join(){
        // erst die Join-Nachricht, dann alles Weitere (Presence-Track) in der Warteschlange
        const m = {topic, event:"phx_join", payload:{config:{broadcast:{self:false, ack:false}, presence:{key:opts.key || ""}, private:false}}};
        m.ref = String(++ref); this.joinRef = m.ref;
        const s = JSON.stringify(m);
        if(open && ws && ws.readyState === 1) ws.send(s); else queue.unshift(s);
      },
      _msg(m){
        if(m.event === "phx_reply" && m.ref === this.joinRef){
          if(m.payload && m.payload.status === "ok"){ this.joined = true; if(this.meta) this.track(this.meta); this.h.joined && this.h.joined(); }
          else this.h.error && this.h.error(m.payload);
          return;
        }
        if(m.event === "broadcast"){ const p = m.payload || {}; this.h[p.event] && this.h[p.event](p.payload || {}); return; }
        if(m.event === "presence_state"){ this.presence = {}; for(const k in m.payload) this.presence[k] = m.payload[k].metas; this.h.presence && this.h.presence(this.presence, null); return; }
        if(m.event === "presence_diff"){
          const d = m.payload || {};
          for(const k in (d.leaves || {})) delete this.presence[k];
          for(const k in (d.joins || {})) this.presence[k] = d.joins[k].metas;
          this.h.presence && this.h.presence(this.presence, d); return;
        }
        if(m.event === "phx_error" || m.event === "phx_close"){ this.joined = false; this.h.error && this.h.error(m.payload); }
      },
      send(ev, payload){ send({topic, event:"broadcast", payload:{type:"broadcast", event:ev, payload}}); },
      track(meta){ this.meta = meta; if(this.joined) send({topic, event:"presence", payload:{type:"presence", event:"track", payload:meta}}); },
      leave(){ if(this.joined) send({topic, event:"phx_leave", payload:{}}); delete chans[topic]; this.h = {}; }
    };
    chans[topic] = c;
    connect();
    if(open) c._join();
    return c;
  }
  return {channel};
})();


const id = Math.random().toString(36).slice(2,8);
const log = t => { document.getElementById("log").textContent += new Date().toLocaleTimeString() + "  " + t + "\n"; };
let rx = 0;
const ch = RT.channel("lel-rt-test", {key:id});
ch.meta = {id};
ch.on("joined", () => { document.getElementById("st").textContent = "verbunden"; log("Kanal beigetreten als " + id); })
  .on("error", e => { document.getElementById("st").textContent = "Fehler"; log("Fehler: " + JSON.stringify(e)); })
  .on("presence", p => { const n = Object.keys(p).filter(k => k !== id).length; document.getElementById("n").textContent = n; log("Presence: " + Object.keys(p).join(", ")); })
  .on("hi", m => { rx++; document.getElementById("rx").textContent = rx; log("Nachricht von " + m.id); });
setInterval(() => ch.send("hi", {id}), 3000);
</script></body></html>
